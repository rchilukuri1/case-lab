<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Case Lab by the Consulting Club at GSU: lessons, practice cases and drills for consulting case interviews.">
<title>Consulting Club Case Lab</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Poppins:wght@300;400;500&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: navy header with three sections (Learn / Practice / Reference), a white side list of that section's pages, and one reading column on a pale blue ground. Single light theme in Georgia State blues. */
:root{
  color-scheme: light;
  --bg:#F3F7FD; --surface:#EDF3FC; --card:#FFFFFF; --line:#D7E3F3; --line2:#B8CCE8;
  --ink:#0B1F4B; --muted:#3B5177; --faint:#687D9F;
  --navy:#0B1F4B; --navy2:#13306E;
  --blue:#0039A6; --blueBg:#E7EFFC; --sky:#4C9BE8; --skyBg:#DCEBFD;
  --gold:#A8650A; --goldBg:#FFF5E2;
  --green:#18794E; --greenBg:#E7F6EE;
  --red:#B8372F; --redBg:#FDECEB;
  --violet:#5B45B8;
  --onblue:#FFFFFF;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
/* header */
.top{background:var(--navy);color:var(--onblue);padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.mark{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.14em;color:var(--navy);background:var(--onblue);border-radius:4px;padding:5px 9px}
.top h1{font-family:var(--f-display);font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em;color:var(--onblue)}
.top p{margin:0;color:#B9CCEE;font-size:13px}
.secs{display:flex;gap:4px;max-width:1180px;margin:12px auto 0;overflow-x:auto}
.secs button{background:transparent;border:0;color:#C7D7F2;padding:10px 16px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:700;font-size:14.5px;white-space:nowrap;font-family:var(--f-display)}
.secs button:hover{color:var(--onblue);background:var(--navy2)}
.secs button[aria-current="true"]{background:var(--bg);color:var(--blue)}
.secs button small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;opacity:.8}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-block:24px 30px}
.nav-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.ng{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:6px 10px 8px}
nav.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;color:var(--muted);cursor:pointer;font-size:14.5px}
nav.side button .k{font-family:var(--f-mono);font-size:11px;color:var(--faint);min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);flex-shrink:0}
nav.side button .k.done{background:var(--green);border-color:var(--green);color:#fff}
nav.side button:hover{background:var(--surface);color:var(--ink)}
nav.side button[aria-current="true"]{background:var(--skyBg);color:var(--blue);font-weight:700}
nav.side button[aria-current="true"] .k{border-color:var(--blue);color:var(--blue)}
nav.side button[aria-current="true"] .k.done{color:#fff}
.prog{margin:12px 10px 4px;font-size:12.5px;color:var(--muted)}
.bar{height:7px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--green);border-radius:4px}
main{min-width:0;padding-block:26px 70px}
.wrap{max-width:820px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;color:var(--sky);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
h2.title{font-family:var(--f-display);font-size:clamp(25px,4vw,33px);font-weight:800;line-height:1.15;margin:6px 0 8px;letter-spacing:-.015em;text-wrap:balance;color:var(--navy)}
.lede{color:var(--muted);font-size:16.5px;max-width:62ch;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.sh{font-family:var(--f-display);font-size:16px;font-weight:800;margin:0 0 10px;color:var(--navy)}
.sh.gold{color:var(--gold)}.sh.green{color:var(--green)}.sh.red{color:var(--red)}.sh.violet{color:var(--violet)}
p{margin:0 0 10px;color:var(--muted);max-width:70ch}
strong,b{color:var(--ink);font-weight:700}
.takeaways{background:var(--navy);color:var(--onblue);border-radius:10px;padding:16px 20px;margin-bottom:18px}
.takeaways .ct{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9CC4F5;margin-bottom:8px}
.takeaways ol{margin:0;padding-left:20px}
.takeaways li{margin-bottom:4px;color:var(--onblue)}
.takeaways li::marker{color:#9CC4F5;font-weight:700}
.callout{border-left:3px solid var(--blue);background:var(--blueBg);border-radius:0 8px 8px 0;padding:11px 15px;margin:12px 0}
.callout .ct{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.callout div:last-child{color:var(--ink);font-size:14.5px}
.callout.gold{border-color:var(--gold);background:var(--goldBg)}.callout.gold .ct{color:var(--gold)}
.callout.green{border-color:var(--green);background:var(--greenBg)}.callout.green .ct{color:var(--green)}
.callout.red{border-color:var(--red);background:var(--redBg)}.callout.red .ct{color:var(--red)}
ul.bl{list-style:none;padding:0;margin:0 0 8px}
ul.bl li{position:relative;padding-left:18px;margin-bottom:6px;color:var(--muted)}
ul.bl li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--sky)}
ul.bl.gold li::before{background:var(--gold)}ul.bl.green li::before{background:var(--green)}ul.bl.red li::before{background:var(--red)}
ol.st{list-style:none;counter-reset:s;padding:0;margin:0}
ol.st li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:12px;color:var(--muted)}
ol.st li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--onblue);font-family:var(--f-display);font-weight:800;font-size:12.5px;display:grid;place-items:center}
ol.st li b:first-child{display:block}
.g2,.g3{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-width:0}
.box h4{margin:0 0 6px;font-size:14.5px;font-family:var(--f-display);font-weight:700;color:var(--blue)}
.box.gold h4{color:var(--gold)}.box.green h4{color:var(--green)}.box.red h4{color:var(--red)}.box.violet h4{color:var(--violet)}
.box p{font-size:14px;margin-bottom:0}
.kv{background:var(--surface);border-radius:8px;padding:9px 13px}
.kv .k{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.kv .v{color:var(--ink);font-weight:600;font-size:14.5px;margin-top:2px}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.85;color:var(--muted);overflow-x:auto;white-space:pre;margin:10px 0}
.c-b{color:var(--blue);font-weight:600}.c-g{color:var(--gold);font-weight:600}.c-gr{color:var(--green);font-weight:600}.c-r{color:var(--red);font-weight:600}
.tree{background:var(--surface);border-radius:8px;padding:12px 14px;overflow-x:auto}
.tr{display:flex;align-items:center;gap:6px;padding:3px 0;white-space:nowrap}
.tr i{width:12px;height:1px;background:var(--line2);flex-shrink:0}
.tr span{border-radius:5px;padding:3px 9px;font-size:13px;border:1px solid}
.vs{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.vs > div{border-radius:8px;padding:12px 14px;min-width:0;border:1px solid}
.vs .bad{background:var(--redBg);border-color:color-mix(in srgb,var(--red) 20%,transparent)}
.vs .good{background:var(--greenBg);border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.vs .lab{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.vs .bad .lab{color:var(--red)}.vs .good .lab{color:var(--green)}
.vs .bad p{color:var(--muted)}.vs .good p{color:var(--ink)}
.badge{display:inline-block;border-radius:4px;font-size:11px;font-weight:700;padding:2px 8px;background:var(--blueBg);color:var(--blue);font-family:var(--f-display);letter-spacing:.03em}
.badge.gold{background:var(--goldBg);color:var(--gold)}
.badge.green{background:var(--greenBg);color:var(--green)}
.badge.red{background:var(--redBg);color:var(--red)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line2);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.pill:hover{color:var(--blue);border-color:var(--sky)}
.pill[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--onblue)}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--onblue);border-radius:7px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.ghost{background:var(--card);color:var(--blue)}
.btn.ghost:hover{background:var(--blueBg)}
.btn.gold{background:var(--green);border-color:var(--green)}
.btn.light{background:var(--onblue);color:var(--navy);border-color:var(--onblue)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
details.acc{background:var(--card);border-radius:10px;margin-bottom:10px;border:1px solid var(--line)}
details.acc summary{cursor:pointer;padding:13px 18px;color:var(--navy);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:15px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--blue);font-size:20px;line-height:1}
details.acc[open] summary::after{content:"−"}
details.acc > div{padding:0 18px 14px}
details.acc .card{border:0;padding:6px 0 4px;margin:0}
.deeper{margin-top:22px}
.deeper > .lab{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px}
.tbl-w{overflow-x:auto;margin:8px 0 12px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;background:var(--card)}
table.tbl th{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--blueBg);text-align:left;padding:8px 10px;white-space:nowrap}
table.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;color:var(--ink);white-space:nowrap}
table.tbl td.n,table.tbl th.n{text-align:right}
/* home */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);color:var(--onblue);border-radius:14px;padding:26px 26px 24px;margin-bottom:18px}
.hero .eyebrow{color:#9CC4F5}
.hero h2.title{color:var(--onblue);margin-top:8px}
.hero p{color:#D6E4FA;font-size:16.5px;max-width:58ch}
.hero .row{margin-top:14px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.track{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.track:hover{border-color:var(--sky);box-shadow:0 4px 14px color-mix(in srgb,var(--blue) 10%,transparent)}
.track .tn{font-family:var(--f-mono);font-size:11.5px;color:var(--sky);font-weight:600}
.track h3{margin:0;font-family:var(--f-display);font-size:18px;color:var(--navy)}
.track p{font-size:14px;margin:0}
.track .go-l{margin-top:auto;color:var(--blue);font-weight:700;font-size:13.5px;padding-top:6px}
.path{display:flex;flex-direction:column;gap:0}
.path-i{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.path-i:last-child{border-bottom:0}
.path-i .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-family:var(--f-mono);font-size:12px;color:var(--blue)}
.path-i .k.done{background:var(--green);border-color:var(--green);color:#fff}
.path-i b{display:block;font-size:15px}
.path-i span{color:var(--faint);font-size:13px}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;background:var(--navy);color:var(--onblue)}
.msg.me .av{background:var(--sky)}
.bub{max-width:84%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.msg.me .bub{background:var(--skyBg);border-color:color-mix(in srgb,var(--sky) 30%,transparent)}
.bub .who{font-family:var(--f-display);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.msg.me .bub .who{color:var(--blue)}
.bub p,.bub li{color:var(--ink);font-size:14.5px}
.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{margin:4px 0 8px;padding-left:20px}
.note{margin:6px 0 0 39px;background:var(--goldBg);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);border-radius:7px;padding:8px 12px;font-size:13.5px;color:var(--ink)}
.note::before{content:"Coach: ";font-weight:700;color:var(--gold)}
/* practice */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 160px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.stage-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--blueBg);flex-wrap:wrap}
.stage-h .no{font-family:var(--f-mono);font-size:12px;color:var(--sky);font-weight:600}
.stage-h h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--navy)}
.stage-h .badge{margin-left:auto;background:var(--card)}
.stage-b{padding:14px 16px}
.tip{background:var(--goldBg);border-radius:7px;padding:8px 12px;font-size:13.5px;color:var(--ink);margin-bottom:10px}
.tip b{color:var(--gold)}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.ans input{width:170px;flex:0 0 auto}
.fb{font-size:14px;border-radius:7px;padding:9px 12px;margin-top:8px}
.fb.ok{background:var(--greenBg);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,transparent)}
.fb.no{background:var(--redBg);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.fb.info{background:var(--blueBg);color:var(--ink);border:1px solid var(--line2)}
.sol{background:var(--surface);border:1px dashed var(--line2);border-radius:7px;padding:10px 13px;margin-top:8px;font-size:14px;color:var(--ink)}
.sol .lab{font-family:var(--f-display);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.chip:hover{border-color:var(--sky)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blueBg);color:var(--blue)}
.qa{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.qa div{background:var(--surface);border-radius:7px;padding:8px 12px;font-size:14px}
.qa div b{display:block;color:var(--blue);font-size:12.5px}
.mc{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mc button{text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.mc button:hover{border-color:var(--sky)}
.mc button.right{border-color:var(--green);background:var(--greenBg)}
.mc button.wrong{border-color:var(--red);background:var(--redBg)}
.case-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.code-tag{font-family:var(--f-mono);font-size:12.5px;color:var(--blue);background:var(--blueBg);border:1px solid var(--line2);border-radius:5px;padding:3px 8px;user-select:all}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.score select{width:auto}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.svg-w{overflow-x:auto;background:var(--surface);border-radius:8px;padding:10px}
.drill-q{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--navy);margin:6px 0 10px;text-wrap:balance}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.stat b{color:var(--blue)}
.gl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl dt{font-weight:700;color:var(--navy)}
.gl dd{margin:0;color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){
  .app{grid-template-columns:1fr;gap:0}
  nav.side{position:static;padding-block:14px 0}
  .nav-card{display:flex;overflow-x:auto;gap:4px;padding:6px}
  .ng,.prog{display:none}
  nav.side button{width:auto;white-space:nowrap;flex-shrink:0}
  .tracks{grid-template-columns:1fr}
}
@media (max-width:640px){
  .g2,.g3,.vs{grid-template-columns:1fr}
  .bub{max-width:100%}
  .gl{grid-template-columns:1fr}
  .hero{padding:20px 18px}
}
/* v3 additions */
.app > *{min-width:0}
.app.solo{grid-template-columns:minmax(0,1fr)}
.app.solo nav.side{display:none}
.app.solo .wrap{max-width:1040px;margin:0 auto}

const CC = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v - 1e-9) return m * p; return 10 * p; }

const legendH = names => names.length < 2 ? "" : `<div class="lgd">${names.map((n, i) => `<span><i style="background:${CC[i]}"></i>${n}</span>`).join("")}</div>`;
function fig(title, body, o = {}) {
  return `<figure class="chart"><figcaption><b>${title}</b>${o.sub ? `<span>${o.sub}</span>` : ""}</figcaption>${legendH(o.legend || [])}<div class="svg-w">${body}</div>${o.note ? `<p class="cnote">${o.note}</p>` : ""}</figure>`;
}
function wrapLab(t, x, y, cls = "ax c", max = 14) {
  const w = String(t).split(" "), lines = [""];
  w.forEach(s => { const cur = lines[lines.length - 1]; if ((cur + " " + s).trim().length > max && cur) lines.push(s); else lines[lines.length - 1] = (cur + " " + s).trim(); });
  return `<text x="${x}" y="${y}" class="${cls}" text-anchor="middle">${lines.slice(0, 2).map((l, i) => `<tspan x="${x}" dy="${i ? 14 : 0}">${l}</tspan>`).join("")}</text>`;
}
function vbars({ cats, series, pre = "", suf = "", dec = 0, h = 250, stacked = false }) {
  const W = 640, L = 52, R = 12, T = 24, B = 44, ph = h - T - B;
  const tot = cats.map((_, i) => series.reduce((a, s) => a + s.vals[i], 0));
  const max = niceMax(Math.max(...(stacked ? tot : series.flatMap(s => s.vals))) * 1.1);
  const gw = (W - L - R) / cats.length, n = stacked ? 1 : series.length;
  const bw = Math.min(58, (gw * 0.7 - (n - 1) * 4) / n);
  let s = `<svg viewBox="0 0 ${W} ${h}" class="cs" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = T + ph - ph * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="${k ? "gl" : "base"}"/><text x="${L - 8}" y="${y + 4}" class="ax" text-anchor="end">${pre}${nf(v, max < 10 ? 1 : 0)}${suf}</text>`; }
  cats.forEach((c, i) => {
    const gx = L + i * gw + gw / 2; let accH = 0;
    series.forEach((se, j) => {
      const v = se.vals[i], bh = v / max * ph;
      const x = stacked ? gx - bw / 2 : gx - (n * bw + (n - 1) * 4) / 2 + j * (bw + 4);
      const y = T + ph - accH - bh;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh - (stacked && j ? 2 : 0), 0)}" rx="3" fill="${se.color || CC[j]}"><title>${se.name ? se.name + " · " : ""}${c}: ${pre}${nf(v, dec)}${suf}</title></rect>`;
      if (!stacked) s += `<text x="${x + bw / 2}" y="${y - 6}" class="vl" text-anchor="middle">${pre}${nf(v, dec)}${suf}</text>`;
      else if (bh > 18) s += `<text x="${x + bw / 2}" y="${y + bh / 2 + 4}" class="vl in" text-anchor="middle">${nf(v, dec)}</text>`;
      if (stacked) accH += bh;
    });
    if (stacked) s += `<text x="${gx}" y="${T + ph - accH - 6}" class="vl" text-anchor="middle">${pre}${nf(tot[i], dec)}${suf}</text>`;
    s += wrapLab(c, gx, h - 24);
  });
  return s + `</svg>`;
}
function hbars({ rows, pre = "", suf = "", dec = 0, hl = -1, color }) {
  const W = 640, L = 200, R = 70, rh = 36, h = rows.length * rh + 8;
  const max = niceMax(Math.max(...rows.map(r => r[1])) * 1.02);
  let s = `<svg viewBox="0 0 ${W} ${h}" class="cs" role="img">`;
  rows.forEach(([lab, v], i) => {
    const y = 4 + i * rh, w = Math.max(v / max * (W - L - R), 2);
    s += `<text x="${L - 10}" y="${y + rh / 2 + 4}" class="ax c" text-anchor="end">${lab}</text><rect x="${L}" y="${y + 7}" width="${w}" height="${rh - 14}" rx="3" fill="${i === hl ? "var(--c2)" : color || "var(--c1)"}"><title>${lab}: ${pre}${nf(v, dec)}${suf}</title></rect><text x="${L + w + 7}" y="${y + rh / 2 + 4}" class="vl">${pre}${nf(v, dec)}${suf}</text>`;
  });
  return s + `</svg>`;
}
function lineChart({ x, series, pre = "", suf = "", dec = 0, min = 0, h = 250 }) {
  const W = 640, L = 52, R = 92, T = 18, B = 34, ph = h - T - B, pw = W - L - R;
  const max = niceMax(Math.max(...series.flatMap(s => s.vals)) * 1.05);
  const X = i => L + (x.length === 1 ? pw / 2 : i * pw / (x.length - 1)), Y = v => T + ph - (v - min) / (max - min) * ph;
  let s = `<svg viewBox="0 0 ${W} ${h}" class="cs" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4, y = Y(v); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="${k ? "gl" : "base"}"/><text x="${L - 8}" y="${y + 4}" class="ax" text-anchor="end">${pre}${nf(v, max < 10 ? 1 : 0)}${suf}</text>`; }
  x.forEach((l, i) => { s += `<text x="${X(i)}" y="${h - 12}" class="ax c" text-anchor="middle">${l}</text>`; });
  series.forEach((se, j) => {
    const c = se.color || CC[j];
    s += `<path d="${se.vals.map((v, i) => `${i ? "L" : "M"}${X(i)},${Y(v)}`).join("")}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    se.vals.forEach((v, i) => { s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${c}" stroke="var(--card)" stroke-width="2"><title>${se.name ? se.name + " · " : ""}${x[i]}: ${pre}${nf(v, dec)}${suf}</title></circle>`; });
    const lv = se.vals[se.vals.length - 1];
    s += `<text x="${X(x.length - 1) + 9}" y="${Y(lv) + 4}" class="vl">${se.name ? se.name + " " : ""}${pre}${nf(lv, dec)}${suf}</text>`;
  });
  return s + `</svg>`;
}
function waterfall({ items, pre = "$", suf = "", dec = 0, h = 270 }) {
  const W = 640, L = 52, R = 12, T = 24, B = 46, ph = h - T - B;
  let run = 0;
  const bars = items.map(([lab, v, t]) => {
    if (t === "total") { run = v; return { lab, v, lo: Math.min(0, v), hi: Math.max(0, v), t, end: v }; }
    const lo = Math.min(run, run + v), hi = Math.max(run, run + v); run += v; return { lab, v, lo, hi, t: v < 0 ? "down" : "up", end: run };
  });
  const max = niceMax(Math.max(...bars.map(b => b.hi)) * 1.1), Y = v => T + ph - v / max * ph;
  const gw = (W - L - R) / bars.length, bw = Math.min(66, gw * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${h}" class="cs" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = Y(v); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="${k ? "gl" : "base"}"/><text x="${L - 8}" y="${y + 4}" class="ax" text-anchor="end">${pre}${nf(v, max < 10 ? 1 : 0)}${suf}</text>`; }
  bars.forEach((b, i) => {
    const cx = L + i * gw + gw / 2, x = cx - bw / 2, fill = b.t === "total" ? "var(--c1)" : b.t === "down" ? "var(--wf-down)" : "var(--c3)";
    s += `<rect x="${x}" y="${Y(b.hi)}" width="${bw}" height="${Math.max(Y(b.lo) - Y(b.hi), 1.5)}" rx="3" fill="${fill}"><title>${b.lab}: ${b.v < 0 ? "−" : ""}${pre}${nf(Math.abs(b.v), dec)}${suf}</title></rect>`;
    s += `<text x="${cx}" y="${Y(b.hi) - 6}" class="vl" text-anchor="middle">${b.t === "total" ? "" : b.v < 0 ? "−" : "+"}${pre}${nf(Math.abs(b.v), dec)}${suf}</text>`;
    if (i < bars.length - 1) s += `<line x1="${x + bw}" x2="${x + gw}" y1="${Y(b.end)}" y2="${Y(b.end)}" class="conn"/>`;
    s += wrapLab(b.lab, cx, h - 26);
  });
  return s + `</svg>`;
}

function beChart(P, V, F) {
  const W = 640, H = 270, L = 60, R = 96, T = 16, B = 40, pw = W - L - R, ph = H - T - B;
  const be = P > V ? F / (P - V) : null, xmax = be ? niceMax(be * 2) : 2;
  const ymax = niceMax(Math.max(P * xmax, F + V * xmax) * 1.02), X = u => L + u / xmax * pw, Y = v => T + ph - v / ymax * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="cs" role="img" aria-label="Breakeven chart">`;
  for (let k = 0; k <= 4; k++) { const v = ymax * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="${k ? "gl" : "base"}"/><text x="${L - 8}" y="${Y(v) + 4}" class="ax" text-anchor="end">$${nf(v)}M</text>`; const u = xmax * k / 4; s += `<text x="${X(u)}" y="${H - 14}" class="ax" text-anchor="middle">${nf(u, 2)}M units</text>`; }
  if (be) s += `<path d="M${X(be)},${Y(P * be)} L${X(xmax)},${Y(P * xmax)} L${X(xmax)},${Y(F + V * xmax)} Z" fill="var(--c3)" fill-opacity=".12"/><path d="M${X(0)},${Y(0)} L${X(0)},${Y(F)} L${X(be)},${Y(P * be)} Z" fill="var(--wf-down)" fill-opacity=".1"/>`;
  s += `<line x1="${X(0)}" x2="${X(xmax)}" y1="${Y(F)}" y2="${Y(F)}" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X(xmax) + 6}" y="${Y(F) + 4}" class="ax">Fixed costs</text>`;
  s += `<line x1="${X(0)}" y1="${Y(F)}" x2="${X(xmax)}" y2="${Y(F + V * xmax)}" stroke="var(--c2)" stroke-width="2.5"/><text x="${X(xmax) + 6}" y="${Y(F + V * xmax) + 4}" class="vl">Total cost</text>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(P * xmax)}" stroke="var(--c1)" stroke-width="2.5"/><text x="${X(xmax) + 6}" y="${Y(P * xmax) + 4}" class="vl">Revenue</text>`;
  if (be) s += `<line x1="${X(be)}" x2="${X(be)}" y1="${Y(0)}" y2="${Y(P * be)}" stroke="var(--ink)" stroke-dasharray="3 3"/><circle cx="${X(be)}" cy="${Y(P * be)}" r="6" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/><text x="${X(be) - 8}" y="${Y(P * be) - 12}" class="vl" text-anchor="end">Breakeven</text><text x="${X(be * 1.45)}" y="${Y(P * be * 1.45) - 22}" class="ax" text-anchor="middle" fill="var(--green)">profit</text><text x="${X(be * 0.45)}" y="${Y(F) - 8}" class="ax" text-anchor="middle" fill="var(--red)">loss</text>`;
  return s + `</svg>`;
}

  set(k, v) { try { localStorage.setItem("ccl-" + k, JSON.stringify(v)); } catch (e) {} },
};
let DONE = new Set(store.get("done", []));
let QZ = store.get("quiz", {});
const isDone = id => DONE.has(id);
function markDone(id) { DONE.add(id); store.set("done", [...DONE]); }

function renderNav() {
  const g = PG(current).g;
  $("#secs").innerHTML = GROUPS.map(x => `<button data-go="${PAGES.find(p => p.g === x.id).id}" aria-current="${x.id === g}">${x.label}<small>${x.sub}</small></button>`).join("");
  $(".app").classList.toggle("solo", g === "home");
  const n = LESSONS.filter(isDone).length;
  const item = p => `<button data-go="${p.id}" aria-current="${p.id === current}"><span class="k ${p.lesson && isDone(p.id) ? "done" : ""}">${p.lesson && isDone(p.id) ? "✓" : p.k}</span>${p.label}</button>`;
  let inner = "";
  if (g === "learn") inner = item(PG("lessons")) + MODS.map(([m, l]) => `<div class="ng">${l}</div>` + PAGES.filter(p => p.m === m).map(item).join("")).join("") + `<div class="prog">${n} of ${LESSONS.length} lessons done<div class="bar"><i style="width:${n / LESSONS.length * 100}%"></i></div></div>`;
  else inner = `<div class="ng">${GROUPS.find(x => x.id === g).label}</div>` + PAGES.filter(p => p.g === g).map(item).join("");
  $("#nav").innerHTML = g === "home" ? "" : `<div class="nav-card">${inner}</div>`;
}
function go(id, push = true) {
  if (!VIEWS[id] || !PG(id)) id = "home";
  current = id;
  renderNav();
  const page = PG(id), sib = PAGES.filter(p => p.g === page.g), i = sib.indexOf(page);
  const prev = sib[i - 1], next = sib[i + 1];
  $("#view").innerHTML = VIEWS[id]() + (page.g === "home" ? "" : `<div class="next">${prev ? `<button class="btn ghost sm" data-go="${prev.id}">← ${prev.label}</button>` : "<span></span>"}${next ? `<button class="btn ghost sm" data-go="${next.id}">${next.label} →</button>` : ""}</div>`);
  (INIT[id] || (() => {}))();
  if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
  window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const d = e.target.closest("[data-complete]");
  if (d) { const id = d.dataset.complete; markDone(id); go(LESSONS[LESSONS.indexOf(id) + 1] || "library"); return; }
  const srt = e.target.closest("[data-srt]");
  if (srt) { answerSort(srt); return; }
  const cd = e.target.closest("[data-cod]");
  if (cd) { openDaily(); return; }
  const ol = e.target.closest("[data-openlib]");
  if (ol) { openLib(ol.dataset.openlib); return; }
  const lb = e.target.closest("[data-libback]");
  if (lb) { G.libOpen = false; go("library"); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const st = e.target.closest("[data-sub]");
  if (st) {
    const grp = st.dataset.sub;
    $$(`[data-sub="${grp}"]`).forEach(b => b.setAttribute("aria-pressed", b === st));
    $$(`[data-subpane="${grp}"]`).forEach(x => x.hidden = x.dataset.id !== st.dataset.id);
    const tabsEl = $(`.subtabs [data-sub="${grp}"]`); if (st.closest("[data-subpane]") && tabsEl) tabsEl.parentElement.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const qz = e.target.closest("[data-qz]");
  if (qz) { answerQuiz(qz); return; }
  const p = e.target.closest("[data-tabs]");
  if (p) {
    const grp = p.dataset.tabs;
    $$(`[data-tabs="${grp}"]`).forEach(b => b.setAttribute("aria-pressed", b === p));
    $$(`[data-pane="${grp}"]`).forEach(x => x.hidden = x.dataset.id !== p.dataset.id);
  }
});
const tabs = (grp, items, first) => `<div class="pills">${items.map(it => `<button class="pill" data-tabs="${grp}" data-id="${it.id}" aria-pressed="${it.id === first}">${it.label}</button>`).join("")}</div>` +
  items.map(it => `<div data-pane="${grp}" data-id="${it.id}" ${it.id === first ? "" : "hidden"}>${it.html}</div>`).join("");
const head = (eb, t, lede) => `<div class="eyebrow">${eb}</div><h2 class="title">${t}</h2><p class="lede">${lede}</p>`;
const more = (s, h) => `<details class="more"><summary>${s}</summary><div>${h}</div></details>`;
const vis = (h, cap) => `<div class="vis">${h}${cap ? `<p class="vis-cap">${cap}</p>` : ""}</div>`;

/* lesson shell: visual first, three takeaways, then short tabs */
function lesson(id, mins, title, lede, visual, take, sections) {
  const p = PG(id), n = LESSONS.indexOf(id) + 1, done = isDone(id), last = n === LESSONS.length;
  const qs = QUIZ[id] || [], secs = [...sections];
  if (qs.length) secs.push({ id: "quiz", label: "Quick check", html: quizHTML(id) });
  const qScore = QZ[id] ? Object.values(QZ[id]).filter(Boolean).length : 0;
  return `<div class="eyebrow">${MODS.find(m => m[0] === p.m)[1]} · Lesson ${n} of ${LESSONS.length} · about ${mins} min</div><h2 class="title">${title}</h2><p class="lede">${lede}</p>
  ${visual}
  <div class="three">${take.map((t, i) => `<div><b>${i + 1}</b><span>${t}</span></div>`).join("")}</div>
  <div class="subtabs" role="tablist">${secs.map((s, i) => `<button data-sub="${id}" data-id="${s.id}" aria-pressed="${i === 0}">${s.label}${s.id === "quiz" ? `<span class="q">${qScore}/${qs.length}</span>` : ""}</button>`).join("")}</div>
  ${secs.map((s, i) => `<div data-subpane="${id}" data-id="${s.id}" ${i === 0 ? "" : "hidden"}>${s.html}${i < secs.length - 1 ? `<div style="text-align:right;margin-top:6px"><button class="btn ghost sm" data-sub="${id}" data-id="${secs[i + 1].id}">Next: ${secs[i + 1].label} →</button></div>` : ""}</div>`).join("")}
  <div class="card" style="margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span class="muted">${done ? "You've completed this lesson." : "Read the tabs and tried the quick check?"}</span><button class="btn ${done ? "ghost" : ""}" data-complete="${id}">${done ? (last ? "Go to the case library →" : "Next lesson →") : (last ? "Mark complete & start practicing" : "Mark complete & continue")}</button></div>`;
}
function quizHTML(id) {
  return `<p>Three questions to check you've got it. Pick an answer to see why.</p>` + QUIZ[id].map((q, i) => `<div class="quiz-q"><p class="qq">${i + 1}. ${q.q}</p><div class="mc" id="qz-${id}-${i}">${q.o.map((o, j) => `<button data-qz="${id}" data-i="${i}" data-j="${j}">${o}</button>`).join("")}</div><div id="qzf-${id}-${i}"></div></div>`).join("");
}
function answerQuiz(b) {
  const id = b.dataset.qz, i = +b.dataset.i, j = +b.dataset.j, q = QUIZ[id][i], bx = $(`#qz-${id}-${i}`);
  if (bx.dataset.done) return;
  bx.dataset.done = 1;
  $$("button", bx).forEach((x, k) => { if (k === q.a) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
  $(`#qzf-${id}-${i}`).innerHTML = `<div class="fb ${j === q.a ? "ok" : "no"}">${j === q.a ? "Right." : "Not quite."} ${q.why}</div>`;
  QZ[id] = QZ[id] || {}; QZ[id][i] = j === q.a; store.set("quiz", QZ);
  const tab = $(`[data-sub="${id}"][data-id="quiz"] .q`); if (tab) tab.textContent = Object.values(QZ[id]).filter(Boolean).length + "/" + QUIZ[id].length;
}

const QUIZ = {
  intro: [
    { q: "What is a case interview mainly testing?", o: ["How much you know about the industry", "How you think through a business problem", "How fast you can do math"], a: 1, why: "Industry knowledge isn't expected. Interviewers watch how you structure, analyze and communicate." },
    { q: "Which is the right order of a case?", o: ["Analyze → structure → understand → recommend", "Understand → structure → analyze → recommend", "Structure → recommend → analyze → understand"], a: 1, why: "Understand the problem, plan your approach, work through it, then recommend." },
    { q: "Sales fell 10%. What's the best thing to say next?", o: ["“Okay, what's the next piece of data?”", "“So this looks like a revenue problem, not a cost problem. I'd like to see sales by product.”", "“That's a lot.”"], a: 1, why: "That's the so-what: what the number means and where to go next." },
  ],
  fundamentals: [
    { q: "A store sells 1,000 shirts at $20 each. Each costs $8 to make, and rent is $5,000. What's the profit?", o: ["$7,000", "$12,000", "$15,000"], a: 0, why: "Revenue $20,000 − variable costs $8,000 − fixed $5,000 = $7,000." },
    { q: "Which is a variable cost for a pizza restaurant?", o: ["Rent", "Cheese", "The manager's salary"], a: 1, why: "Cheese rises with every pizza sold. Rent and salaries stay the same." },
    { q: "Fixed costs are $60K and each unit earns $20 of contribution. Breakeven?", o: ["1,200 units", "3,000 units", "6,000 units"], a: 1, why: "$60,000 ÷ $20 = 3,000 units." },
  ],
  opening: [
    { q: "What should you do right after hearing the prompt?", o: ["Ask for all the data", "Repeat the problem back in your own words", "Start giving solutions"], a: 1, why: "Playing it back confirms you're solving the right problem." },
    { q: "Which is the best clarifying question?", o: ["“What are the client's costs?”", "“Is this decline only our client, or the whole industry?”", "“What's the CEO's name?”"], a: 1, why: "It changes where you look first. Cost questions belong in the analysis." },
    { q: "How many clarifying questions should you usually ask?", o: ["2–3", "8–10", "None"], a: 0, why: "A few sharp questions show focus. A long list looks unstructured." },
  ],
  structure: [
    { q: "What does MECE mean?", o: ["Pieces overlap so nothing is missed", "Pieces don't overlap and together cover everything", "Use exactly four pieces"], a: 1, why: "Mutually exclusive (no overlap), collectively exhaustive (nothing missing)." },
    { q: "Which split is MECE for “why is profit down?”", o: ["Marketing, sales team, competitors", "Revenue and costs", "Products and customers and marketing"], a: 1, why: "Profit = revenue − costs, so those two always cover everything." },
    { q: "What's a hypothesis in a case?", o: ["Your final answer", "Your best early guess, which you test with data", "A formula"], a: 1, why: "A hypothesis focuses your analysis. Update it openly when data disagrees." },
  ],
  math: [
    { q: "Fixed costs are $20M; each unit sells for $50 and costs $30. Breakeven units?", o: ["400,000", "1,000,000", "666,667"], a: 1, why: "$20M ÷ ($50 − $30) = 1M units." },
    { q: "Margin moves from 20% to 15%. Which is correct?", o: ["It fell 5%", "It fell 5 percentage points, or 25%", "It fell 25 percentage points"], a: 1, why: "The difference is 5 points; relative to 20%, that's a 25% decline." },
    { q: "What should you do after getting an answer?", o: ["Move straight on", "Say what the number means for the client", "Ask the interviewer if it's right"], a: 1, why: "Every number needs a so-what." },
  ],
  exhibits: [
    { q: "What's the first thing to do with a new chart?", o: ["Give your conclusion", "Read the title, axes and units out loud", "Ask for a different chart"], a: 1, why: "Labels first. It catches unit traps and buys you thinking time." },
    { q: "Which is the strongest insight?", o: ["“Online is the orange bar.”", "“Online grew $50M and more than offset the $30M drop in retail.”", "“There are three channels.”"], a: 1, why: "It has a number and says what changed." },
    { q: "A segment's share of sales fell. Did its sales fall?", o: ["Yes, always", "Not necessarily; the total may have grown faster", "Never"], a: 1, why: "Share is relative. Check the absolute numbers too." },
  ],
  sizing: [
    { q: "What comes first in market sizing?", o: ["Plugging in numbers", "Writing the equation", "Giving the final answer"], a: 1, why: "The equation shows your logic before any guesses." },
    { q: "About how many US households are there?", o: ["~30M", "~130M", "~330M"], a: 1, why: "About 130M households; about 340M people." },
    { q: "Why do a sanity check?", o: ["To catch an estimate that's off by 10× or more", "It's required", "To make the answer more precise"], a: 0, why: "Comparing per person or per household catches big errors." },
  ],
  brainstorm: [
    { q: "What do you say first when brainstorming?", o: ["Your best idea", "The groups you'll organize ideas into", "Every idea as fast as possible"], a: 1, why: "Groups first make your ideas easy to follow and show structure." },
    { q: "Which grouping works for “how can we grow revenue?”", o: ["Existing customers vs. new customers", "Good ideas vs. bad ideas", "Monday vs. Friday"], a: 0, why: "It's MECE and covers the whole space." },
    { q: "How should you end a brainstorm?", o: ["Say “that's all”", "Name the idea you'd test first, and why", "Ask the interviewer for theirs"], a: 1, why: "Prioritizing shows judgment, not just creativity." },
  ],
  synthesis: [
    { q: "What should your first sentence be?", o: ["A summary of what you analyzed", "The answer: “The client should…”", "A thank-you"], a: 1, why: "Answer first. Then reasons, risk, next step." },
    { q: "Which belongs in a strong recommendation?", o: ["Every number from the case", "2–3 reasons with numbers, a risk, and a next step", "Only the risks"], a: 1, why: "That's the full template, in under a minute." },
    { q: "You're asked for a recommendation before you're ready. You:", o: ["Say you need more data", "Give your best answer and say what would change it", "Guess randomly"], a: 1, why: "Consultants give a view with the information they have." },
  ],
};

const WALK = [
  ["i", "Our client is Hartwell Pumps, a US maker of industrial pumps with about $600M in revenue. They're considering launching a predictive maintenance subscription: sensors on installed pumps that warn customers before a failure. Should they launch it?"],
  ["y", "Let me play that back: Hartwell, $600M industrial pump maker, deciding whether to launch a sensor-based predictive maintenance subscription. Two questions. What does success look like for the CEO? And would we sell this only on new pumps, or also retrofit pumps already installed?",
    "Plays back the prompt, asks for the objective, and asks one question that changes the size of the opportunity. Short and purposeful."],
  ["i", "The CEO wants new recurring revenue and expects payback within 4 years. They'd offer it on connected pumps already in the field, which can be activated remotely."],
  ["y", "Thanks. May I take a minute to structure? … I'd answer this with four questions. First, is the opportunity big: how many connected pumps, and how many customers would adopt. Second, do customers value it enough to pay: downtime cost avoided versus price, and what competitors offer. Third, do the economics work: subscription revenue minus platform and service costs, against the upfront investment, versus the 4-year payback. Fourth, can Hartwell deliver: data and software capability, service team, and risks. My hypothesis is yes, because unplanned pump failures are expensive for these customers, so I'd like to start with the size of the opportunity.",
    "Structure is specific to this case (connected pumps, downtime, payback), not a generic market-entry list. States a hypothesis and where to start."],
  ["i", "Good. Here's what we know: 200,000 connected Hartwell pumps are installed. Pilot results suggest 25% of them would subscribe at $1,200 per pump per year. What annual revenue would that bring?"],
  ["y", "Adopting pumps are 200,000 times 25%, which is 50,000. Times $1,200 is $60M a year. That's about 10% on top of today's $600M, and it's recurring, so it supports the CEO's goal. Before I'm confident in 25% adoption, I'd want to know who the pilot customers were, but let's look at costs.",
    "States the setup, calculates cleanly, then gives the so-what in proportion to the business (10% of revenue) and flags the assumption that matters."],
  ["i", "Fair point; the pilot was mostly large municipal water utilities. On costs: running the data platform costs $15M a year fixed. Monitoring and field response cost $300 per subscribed pump per year. Building it all requires $90M upfront. Does it meet the CEO's hurdle?"],
  ["y", "Variable costs are 50,000 times $300, which is $15M. Add $15M fixed, so $30M total. Profit is $60M minus $30M, $30M a year. Payback is $90M divided by $30M, 3 years, which beats the 4-year hurdle. But since the pilot was mostly large utilities, adoption among smaller customers may be lower. If adoption fell to 18.75%, revenue would be $45M and profit about $19M, pushing payback near 5 years. So the decision is sensitive to adoption.",
    "Correct math, compares to the hurdle, and then volunteers a sensitivity test tied to the pilot bias. This is what turns a good answer into a great one."],
  ["i", "Interesting. What could stop customers from adopting?"],
  ["y", "Let me split this into customer, product, and competitive reasons. Customer: tight maintenance budgets at smaller utilities, IT and cybersecurity rules against connecting pumps to the internet, and buyers who don't own the downtime cost. Product: false alarms that erode trust, and integration with their existing maintenance software. Competitive: rivals bundling monitoring free with new pumps, and third-party IoT platforms that cover all pump brands. I'd prioritize cybersecurity, since one utility security review can block a whole region.",
    "Buckets first, specific ideas within each, then prioritizes one with a reason."],
  ["i", "The CEO is walking in. What's your recommendation?"],
  ["y", "Hartwell should launch, starting with large utilities. At 25% adoption the service earns about $30M a year on a $90M investment, a 3-year payback against a 4-year hurdle, and it adds recurring revenue equal to 10% of today's sales. The main risk is lower adoption among smaller customers, where payback stretches toward 5 years, along with cybersecurity concerns. So I'd phase the launch: utilities first, with a security certification ready, and a lighter, cheaper tier tested with smaller customers in parallel. Next step: confirm adoption with 10 to 15 mid-size customers before funding the full $90M.",
    "Answer first, numbers that came from the case, a specific risk, a mitigation, and a concrete next step. Under a minute."],
];

function plBars() {
  const rows = [["Revenue", 100, 0, "var(--blue)"], ["Cost of goods sold", 60, 40, "var(--red)"], ["Gross profit", 40, 0, "var(--sky)"], ["Operating expenses", 25, 15, "var(--red)"], ["Operating profit", 15, 0, "var(--green)"]];
  const W = 620, rowH = 44, L = 170, sc = (W - L - 70) / 100;
  let s = `<svg viewBox="0 0 ${W} ${rows.length * rowH + 10}" width="${W}" role="img" aria-label="Simple profit and loss waterfall" style="max-width:100%;height:auto;font-family:var(--f-body)">`;
  rows.forEach(([lab, v, off, c], i) => {
    const y = 6 + i * rowH;
    s += `<text x="${L - 12}" y="${y + 24}" fill="var(--ink)" font-size="13" text-anchor="end" font-weight="${off ? 400 : 700}">${lab}</text><rect x="${L + off * sc}" y="${y + 6}" width="${v * sc}" height="28" rx="3" fill="${c}"/><text x="${L + (off + v) * sc + 8}" y="${y + 25}" fill="var(--ink)" font-size="13" font-weight="600">$${v}</text>`;
  });
  return s + `</svg>`;
}

    { id: "unit", label: "Unit economics", html:
      card("Contribution and breakeven", pre(
`<span class="c-b">Contribution margin ($)</span>  = Price − Variable cost per unit
<span class="c-b">Contribution margin (%)</span>  = Contribution ÷ Price
<span class="c-b">Breakeven units</span>          = Fixed costs ÷ Contribution per unit
<span class="c-b">Breakeven revenue</span>        = Fixed costs ÷ Contribution margin %

<span class="c-g">Example:</span> Revenue 100, variable costs 40, fixed 45
Contribution = 60 (60%). Breakeven revenue = 45 ÷ 0.6 = <span class="c-gr">75</span>`)) +
      card("Operating leverage", pre(
`<span class="c-b">Degree of operating leverage</span> = Contribution ÷ Operating profit

<span class="c-g">Example:</span> contribution 60, profit 15 → DOL = 4
A 10% rise in sales lifts profit ~40% (and a 10% drop cuts it ~40%).`) + `<p style="margin:0">High fixed-cost businesses (airlines, factories, software) have high operating leverage, so volume swings dominate profit.</p>`) +
      card("Customer economics (subscriptions, SaaS, retail)", pre(
`<span class="c-b">LTV</span>  (lifetime value)   = Monthly revenue × Gross margin % ÷ Monthly churn
<span class="c-b">CAC</span>  (acquisition cost) = Sales & marketing spend ÷ New customers
<span class="c-b">LTV ÷ CAC</span>                  healthy ≥ 3
<span class="c-b">CAC payback (months)</span>       = CAC ÷ (Monthly revenue × Gross margin %)

<span class="c-g">Example:</span> $50/month, 80% margin, 4% churn, CAC $250
LTV = 50 × 0.8 ÷ 0.04 = $1,000 → LTV/CAC = <span class="c-gr">4</span>; payback = 250 ÷ 40 = <span class="c-gr">6.25 months</span>`)) },
    { id: "invest", label: "Investment math", html:
      card("Time value of money", `<p>A dollar next year is worth less than a dollar today, because today's dollar could be invested. <b>Discounting</b> converts future cash into today's value.</p>` + pre(
`<span class="c-b">Present value</span>  = Future cash ÷ (1 + r)^t
<span class="c-b">NPV</span>            = −Investment + Σ Cash_t ÷ (1 + r)^t      invest if NPV > 0
<span class="c-b">IRR</span>            = the discount rate that makes NPV = 0  invest if IRR > hurdle
<span class="c-b">Payback</span>        = years until cumulative cash repays the investment
<span class="c-b">Perpetuity</span>     = Cash ÷ r
<span class="c-b">Growing perp.</span>  = Next year's cash ÷ (r − g)
<span class="c-b">Annuity</span>        = Cash × [1 − (1 + r)^−n] ÷ r`)) +

INIT.finance = () => {
  $("#c-go").onclick = () => {
    const r = parseFloat($("#c-r").value) / 100, I = parseFloat($("#c-i").value), cf = $("#c-cf").value.split(/[,\s]+/).map(Number).filter(x => !isNaN(x));
    if (isNaN(r) || isNaN(I) || !cf.length) { $("#c-out").innerHTML = `<div class="fb no">Enter a rate, an investment, and at least one cash flow.</div>`; return; }
    const npv = rr => -I + cf.reduce((a, c, t) => a + c / Math.pow(1 + rr, t + 1), 0);
    let lo = -0.99, hi = 10, irr = null;
    if (npv(lo) * npv(hi) < 0) { for (let k = 0; k < 200; k++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; } irr = (lo + hi) / 2; }
    let cum = -I, pb = null; for (let t = 0; t < cf.length; t++) { if (cum + cf[t] >= 0 && cf[t] > 0) { pb = t + (-cum) / cf[t]; break; } cum += cf[t]; }
    const v = npv(r);
    $("#c-out").innerHTML = `<div class="fb ${v >= 0 ? "ok" : "no"}">NPV at ${fmt(r * 100)}%: <b>${fmt(v, 2)}</b> · IRR: <b>${irr === null ? "n/a" : fmt(irr * 100, 1) + "%"}</b> · Payback: <b>${pb === null ? "not within these years" : fmt(pb, 2) + " years"}</b>. ${v >= 0 ? "Clears the hurdle." : "Doesn't clear the hurdle."}</div>`;
  };
  $("#p-go").onclick = () => {
    const cm = parseFloat($("#p-cm").value) / 100, dp = parseFloat($("#p-dp").value) / 100;
    if (isNaN(cm) || isNaN(dp) || cm + dp <= 0) { $("#p-out").innerHTML = `<div class="fb no">Check the inputs: the margin plus the price change must be above zero.</div>`; return; }
    const dv = -dp / (cm + dp);
    $("#p-out").innerHTML = `<div class="fb info">Volume can change by <b>${fmt(dv * 100, 1)}%</b> before profit changes. ${dp > 0 ? `If you lose less than ${fmt(-dv * 100, 1)}% of volume, the price increase pays off.` : `You need at least ${fmt(dv * 100, 1)}% more volume for the cut to pay off.`}</div>`;
  };
  $("#b-go").onclick = () => {
    const F = parseFloat($("#b-f").value), P = parseFloat($("#b-p").value), V = parseFloat($("#b-v").value);
    if ([F, P, V].some(isNaN) || P <= V) { $("#b-out").innerHTML = `<div class="fb no">Price must be higher than variable cost.</div>`; return; }
    $("#b-out").innerHTML = `<div class="fb info">Breakeven = ${fmt(F, 0)} ÷ (${fmt(P, 2)} − ${fmt(V, 2)}) = <b>${fmt(F / (P - V), 0)} units</b>, or <b>$${fmt(F / (P - V) * P, 0)}</b> of revenue.</div>`;
  };
};

const FAQS = [
  ["Do I need to know about business or the industry?", "No. Everything you need is in the prompt or can be asked for. Read Business basics so terms like margin and fixed costs feel familiar."],
  ["Can I use a calculator?", "Almost never. Use paper and say your math out loud. Practice in Math drills until it feels normal."],
  ["How long is a case?", "Usually 25–40 minutes, often after 10–20 minutes of fit questions."],
  ["Is there one right answer?", "Usually there's a best answer the numbers point to, but how you get there matters more. A well-reasoned answer that's slightly off beats a lucky guess."],
  ["What if my math is wrong?", "Catch it and correct it out loud. Interviewers mind much less than you think. Always sanity-check: does the number make sense?"],
  ["What if I get stuck?", "Go back to your structure and pick the next bucket. Say what you're doing. See What to say › When you're stuck."],
  ["Can I ask the interviewer for help?", "Yes, within reason. Clarifying units or terms is always fine. Asking “what should I do next?” too often is not."],
  ["How should I take notes?", "Turn the page sideways. Prompt and numbers on the left, structure in the middle, math on the right. Keep it neat; interviewers often see it."],
  ["How many buckets should my structure have?", "Three or four, each with 2–3 questions. See Building buckets."],
  ["Should I name the framework I'm using?", "No. Just use the buckets, customized for the client. See Reference › Frameworks."],
  ["How many practice cases do I need?", "Most people feel comfortable after 15–20 and are interview-ready after 30–50, mostly with a partner."],
  ["What's the difference between candidate-led and interviewer-led?", "In candidate-led cases you drive and ask for data. In interviewer-led cases the interviewer asks a set of questions in order. Skills are the same."],
];

function genProfit(r, I) {
  const s = pick(r, [0.5, 0.55, 0.6, 0.65]);
  const vA = sig(I.vol * s), vB = sig(I.vol * (1 - s));
  const pA = sig(I.price * pick(r, [1.05, 1.1, 1.15])), pB = sig(I.price * pick(r, [0.85, 0.9, 0.95]));
  const vc1 = sig(I.vc);
  const driver = pick(r, ["volA", "priceB", "cost"]);
  const d = driver === "volA" ? pick(r, [0.15, 0.2, 0.25]) : driver === "priceB" ? pick(r, [0.1, 0.15, 0.2]) : pick(r, [0.12, 0.15, 0.2]);
  const vA2 = driver === "volA" ? sig(vA * (1 - d), 3) : vA;
  const pB2 = driver === "priceB" ? sig(pB * (1 - d), 3) : pB;
  const vc2 = driver === "cost" ? sig(vc1 * (1 + d), 3) : vc1;
  const rev1 = pA * vA + pB * vB, rev2 = pA * vA2 + pB2 * vB;
  const gm = (rev1 - vc1 * (vA + vB)) / rev1, m = pick(r, [0.1, 0.12, 0.14]);
  const F = sig(rev1 * Math.max(gm - m, 0.05));
  const c1 = F + vc1 * (vA + vB), c2 = F + vc2 * (vA2 + vB);
  const p1 = rev1 - c1, p2 = rev2 - c2, dRev = rev2 - rev1, mg2 = p2 / rev2 * 100;
  const eVol = (vA2 - vA) * (pA - vc1), ePr = (pB2 - pB) * vB, eCost = -(vc2 - vc1) * (vA2 + vB);
  const [A, B] = I.segs;
  const hint = { volA: `A larger competitor launched a cheaper alternative aimed at ${A.toLowerCase()} customers last year.`, priceB: `Several large ${B.toLowerCase()} customers renegotiated terms last year.`, cost: "Input costs (materials, energy, wages) rose sharply over the past year." }[driver];
  const opts = [`Lower volume in ${A}`, `Lower prices in ${B}`, "Higher variable cost per unit", "Higher fixed costs"];
  const right = { volA: 0, priceB: 1, cost: 2 }[driver];
  const brainQ = { volA: `Why might ${A} volume have fallen, and what could ${I.name} do about it?`, priceB: `Why are prices falling in ${B}, and how could ${I.name} defend them?`, cost: `How could ${I.name} offset higher variable costs?` }[driver];
  const brainIdeas = {
    volA: ["<b>Customer side:</b> switching to the competitor's cheaper product; budget cuts; changing needs", "<b>Our offer:</b> price gap now too wide; quality or delivery problems; weaker sales coverage", "<b>Market:</b> segment shrinking overall; channel shift", "<b>Actions:</b> targeted price or bundle for at-risk accounts; value proof (total cost of ownership); win-back program; a lower-cost product variant"],
    priceB: ["<b>Buyer power:</b> consolidated customers negotiating harder; competitors bidding low", "<b>Our behavior:</b> sales team discounting to hit volume; no price guardrails", "<b>Actions:</b> discount approval rules; tie price to service levels or volume commitments; value-based contracts; walk away from unprofitable accounts"],
    cost: ["<b>Procurement:</b> renegotiate, consolidate suppliers, hedge inputs, alternative materials", "<b>Operations:</b> reduce waste and scrap, automate, improve labor scheduling", "<b>Pricing:</b> pass through surcharges, index contracts to input costs", "<b>Product:</b> redesign to use less of the costly input; cut low-margin SKUs"],
  }[driver];
  const share = x => Math.round(Math.abs(x) / Math.abs(p2 - p1) * 100);
  const dom = [eVol, ePr, eCost][right];
  const shareTxt = share(dom) >= 95 ? "Essentially all" : `About ${share(dom)}%`;
  const rec = {
    volA: `Profit fell from ${$m(p1)} to ${$m(p2)}. ${shareTxt} of that drop comes from lost volume in ${A}, where ${units(vA - vA2)} fewer units were sold after a cheaper competitor entered; prices and costs elsewhere were stable. ${I.name} should defend ${A} rather than cut costs: find which accounts switched and why, offer a targeted lower-cost option or bundle, and protect ${B}, which is healthy. Risk: matching the competitor on price could spread to ${B}. Next step: win/loss interviews with the lost accounts.`,
    priceB: `Profit fell from ${$m(p1)} to ${$m(p2)}. ${shareTxt} of that drop comes from a ${Math.round(d * 100)}% price cut in ${B} (${money(pB)} to ${money(pB2)}) with no gain in volume. ${I.name} should stop the price erosion: put discount approval rules in place, tie any concession to volume or contract length, and re-price the least profitable accounts. Risk: losing some ${B} volume, so model which accounts are worth keeping. Next step: account-level price and margin review.`,
