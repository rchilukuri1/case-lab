    prompt: `${I.name}, ${I.what}, has seen profit fall from ${$m(p1)} to ${$m(p2)} over the past year. The CEO wants to know why, and what to do about it.`,
    clarify: [
      ["What is the objective?", "Understand the cause and return to last year's profit within two years."],
      ["How does the client make money?", `It sells ${I.unit}s in two segments: ${A} and ${B}.`],
      ["Have competitors seen the same?", "Competitors' profits were roughly flat. This looks specific to our client."],
      ["Anything change recently?", hint],
      ["Where does it operate?", "United States only."],
    ],
    structure: tree([["Profit decline", 0, "r"], ["Revenue", 1, "g"], [`${A}: price × volume`, 2, "m"], [`${B}: price × volume`, 2, "m"], ["Costs", 1, "b"], ["Fixed costs", 2, "m"], ["Variable cost per unit × volume", 2, "m"], ["External: market, competitors, customers", 1, "v"]]) + `<p style="margin-top:8px">Hypothesis to state: competitors are flat, so this is company-specific. Start with revenue by segment.</p>`,
    steps: [
      { kind: "num", label: "Exhibit 1: Revenue drivers by segment",
        exhibit: fig("Units sold by segment (millions)", vbars({ cats: [A, B], series: [{ name: "Year 1", vals: [vA, vB] }, { name: "Year 2", vals: [vA2, vB] }], dec: 2, h: 220 }), { legend: ["Year 1", "Year 2"] }) + table(["Segment", "Price Y1", "Volume Y1", "Price Y2", "Volume Y2"], [[A, money(pA), units(vA), money(pA), units(vA2)], [B, money(pB), units(vB), money(pB2), units(vB)]], [1, 2, 3, 4]),
        q: "By how much did total revenue change from Year 1 to Year 2? ($M)", ans: dRev, traps: [[rev2, "That's total Year 2 revenue. The question asks how much it changed: Year 2 minus Year 1."], [rev1, "That's Year 1 revenue. Work out Year 2 revenue too, then subtract."]], tol: Math.max(Math.abs(dRev) * 0.02, 0.6), absOk: true,
        sol: `Year 1: ${money(pA)} × ${units(vA)} + ${money(pB)} × ${units(vB)} = ${$m(rev1)}. Year 2: ${money(pA)} × ${units(vA2)} + ${money(pB2)} × ${units(vB)} = ${$m(rev2)}. Change: ${$m(dRev)}${Math.abs(dRev) < 1 ? " (essentially flat, so look at costs)" : ""}.` },
      { kind: "num", label: "Exhibit 2: Cost structure",
        exhibit: table(["Cost", "Year 1", "Year 2"], [["Fixed costs", $m(F), $m(F)], ["Variable cost per unit", money(vc1), money(vc2)], ["Total units sold", units(vA + vB), units(vA2 + vB)]], [1, 2]),
        q: "What is Year 2 profit margin? (%)", ans: mg2, traps: [[p1 / rev1 * 100, "That's Year 1's margin. Use Year 2 revenue and costs."], [p2, "That's Year 2 profit in $M. Divide it by Year 2 revenue to get a margin."]], tol: 0.6,
        sol: `Year 2 costs: ${$m(F)} + ${money(vc2)} × ${units(vA2 + vB)} = ${$m(c2)}. Profit: ${$m(rev2)} − ${$m(c2)} = ${$m(p2)}. Margin: ${fmt(mg2)}% (Year 1 was ${fmt(p1 / rev1 * 100)}%).` },
      { kind: "mc", label: "Diagnosis", q: "Which factor explains most of the profit decline?", opts, right,
        sol: `Profit impact: ${A} volume ${$m(eVol)}, ${B} price ${$m(ePr)}, variable cost ${$m(eCost)}, fixed costs $0M. Total ${$m(p2 - p1)}.` },
      { kind: "brain", label: "Brainstorm", q: brainQ, ideas: brainIdeas },
      { kind: "rec", label: "Recommendation", q: "The CEO joins. Give your recommendation in under a minute.", model: rec },
    ],
  };
}

function genEntry(r, I) {
  const f = I.entry.f.map(([l, v, k]) => [l, k === "x" ? v : sig(v * pick(r, k === "pct" ? [0.8, 1, 1.25] : [0.9, 1, 1.1])), k]);
  const M = f.reduce((acc, [, v, k]) => acc * (k === "pct" ? v / 100 : v), 1);
  const s = pick(r, [0.05, 0.08, 0.1, 0.12]), cm = pick(r, [0.25, 0.3, 0.35, 0.4]);
  const contrib = M * s * cm, FC = sig(contrib * pick(r, [0.3, 0.4, 0.5])), prof = contrib - FC;
  const I0 = sig(prof * pick(r, [2.5, 3, 3.5, 5.5, 6.5])), pb = I0 / prof, H = pick(r, [4, 5]);
  const enter = pb <= H;
  const show = ([l, v, k]) => [l, k === "M" ? fmt(v) + "M" : k === "pct" ? fmt(v) + "%" : k === "$" ? money(v) : fmt(v)];
  const chain = f.map(([, v, k]) => k === "M" ? fmt(v) + "M" : k === "pct" ? fmt(v) + "%" : k === "$" ? money(v) : fmt(v)).join(" × ");
  return {
    title: `${I.name}: entering ${I.entry.market}`, decision: enter ? "yes" : "no",
    prompt: `${I.name}, ${I.what}, is considering entering a new market: ${I.entry.market}. The CEO has asked whether they should enter.`,
    clarify: [
      ["What is the objective?", `Find a new source of growth. The board requires any new venture to pay back within ${H} years.`],
      ["How would they enter?", "Building the business themselves. An acquisition is not on the table."],
      ["Who are the competitors?", "Three established players hold about 70% of the market; the rest is fragmented."],
      ["Does the client have relevant strengths?", `A trusted brand with its current ${I.segs[0].toLowerCase()} customers and existing manufacturing or operating know-how.`],
      ["Time horizon?", "The client expects to reach its target share by year 3."],
    ],
    structure: tree([["Should we enter?", 0, "b"], ["Market attractiveness", 1, "g"], ["Size and growth", 2, "m"], ["Competition and margins", 2, "m"], ["Client ability to win", 1, "gr"], ["Brand, capabilities, channels", 2, "m"], ["Economics", 1, "b"], [`Profit at target share vs. investment (payback ≤ ${H} yrs)`, 2, "m"], ["Risks and entry mode", 1, "v"], ["Competitor response, cannibalization", 2, "m"]]) + `<p style="margin-top:8px">Hypothesis to state: attractive if the market is large enough that a realistic share pays back within ${H} years. Start by sizing the market.</p>`,
    steps: [
      { kind: "num", label: "Exhibit 1: Market sizing inputs", pre: "Before seeing this, try estimating the market yourself, then compare.",
        exhibit: chain(f.map(show)),
        q: "What is the annual market size? ($M)", ans: M, tol: M * 0.02,
        sol: `${chain} = ${$m(M)} a year.` },
      { kind: "num", label: "Exhibit 2: Client economics",
        exhibit: table(["Assumption", "Value"], [["Target market share (year 3)", fmt(s * 100) + "%"], ["Contribution margin", fmt(cm * 100) + "%"], ["Annual fixed costs", $m(FC)], ["Upfront investment", $m(I0)]], [1]),
        q: "What annual profit would the client earn at target share? ($M)", ans: prof, traps: [[contrib, "That's contribution before fixed costs. Subtract the annual fixed costs."], [M * s, "That's revenue at target share. Apply the contribution margin, then subtract fixed costs."]], tol: Math.max(prof * 0.03, 0.2),
        sol: `Revenue: ${$m(M)} × ${fmt(s * 100)}% = ${$m(M * s)}. Contribution: × ${fmt(cm * 100)}% = ${$m(contrib)}. Minus fixed ${$m(FC)} = ${$m(prof)} a year.` },
      { kind: "num", label: "Payback", q: "What is the payback period? (years)", ans: pb, traps: [[I0 / contrib, "You divided by contribution before fixed costs. Use profit after fixed costs."], [prof / I0, "Flip it: payback is investment ÷ yearly profit."]], tol: Math.max(pb * 0.03, 0.1),
        sol: `${$m(I0)} ÷ ${$m(prof)} = ${fmt(pb)} years, against a hurdle of ${H} years.` },
      { kind: "mc", label: "Decision", q: "Based on the economics, should the client enter?", opts: ["Yes, the economics clear the hurdle", "No, not on these numbers"], right: enter ? 0 : 1,
        sol: enter ? `Payback of ${fmt(pb)} years beats the ${H}-year requirement.` : `Payback of ${fmt(pb)} years misses the ${H}-year requirement. Entry only works if share or margin can be pushed higher, or the investment cut.` },
      { kind: "brain", label: "Brainstorm", q: "Beyond the numbers, what should the client check before deciding?",
        ideas: ["<b>Customers:</b> real willingness to buy from us; switching costs from incumbents", "<b>Competitors:</b> likely price war from the three leaders; their cost advantage", "<b>Client:</b> capabilities and talent we lack; distraction from the core business; brand fit", "<b>Channels:</b> access to distributors or retailers; shelf or listing fees", "<b>External:</b> regulation, certifications, input supply"] },
      { kind: "rec", label: "Recommendation", q: "Give your recommendation to the CEO.",
        model: enter
          ? `${I.name} should enter. The market is about ${$m(M)} a year; at a ${fmt(s * 100)}% share the business earns about ${$m(prof)} annually, paying back the ${$m(I0)} investment in ${fmt(pb)} years, inside the ${H}-year hurdle. The main risk is the three incumbents cutting prices, which would squeeze the ${fmt(cm * 100)}% margin. To manage it, enter with a focused segment where our brand is strongest and stage the investment. Next step: validate share assumptions with 20 customer interviews and a pilot region.`
          : `${I.name} should not enter on current terms. The market is about ${$m(M)} a year, but at a ${fmt(s * 100)}% share the business earns only about ${$m(prof)} annually, so the ${$m(I0)} investment takes ${fmt(pb)} years to pay back, beyond the ${H}-year hurdle. It could work if the client won more share, raised margin, or partnered to cut the investment. Next step: test whether a partnership or acquisition (if reconsidered) could change the payback, or redirect investment to the core.` },
    ],
  };
}

function genPricing(r, I) {
  const c = sig(I.vc * pick(r, [1.1, 1.2, 1.3]));
  const ks = [1.5, 1.8, 2.1, 2.5], P = ks.map(k => sig(c * k));
  const base = pick(r, [[58, 46, 34, 20], [55, 47, 38, 22], [60, 45, 30, 18], [52, 45, 36, 26]]);
  const T = base.map(t => t + Math.floor(r() * 4) - 1);
  const N = sig(I.vol * pick(r, [0.2, 0.3]));
  const contrib = P.map((p, i) => N * T[i] / 100 * (p - c));
  const best = contrib.indexOf(Math.max(...contrib));
  const F = sig(contrib[best] * pick(r, [0.35, 0.45, 0.55]));
  const prof = contrib[best] - F, be = F / (P[best] - c);
  const lab = i => `${money(P[i])} (${T[i]}% would buy)`;
  return {
    title: `${I.name}: pricing ${I.prod}`, decision: null, focus: [fmt(P[best], 2)],
    prompt: `${I.name}, ${I.what}, is launching ${I.prod}. Leadership wants to know what price to charge and whether the launch makes money.`,
    clarify: [
      ["What is the objective?", "Maximize annual profit from the new product in its first full year."],
      ["Who are the target customers?", `About ${units(N)} existing customers, each buying at most one unit a year.`],
      ["What does it cost to make?", `Variable cost is ${money(c)} per unit.`],
      ["Are there substitutes?", "Competitors sell a basic version; ours has features customers rated higher in testing."],
      ["Any cannibalization?", "Minimal; it's a new use, not a replacement for the current line."],
    ],
    structure: tree([["What price?", 0, "b"], ["Cost floor", 1, "r"], [`Variable cost ${money(c)} + fixed costs`, 2, "m"], ["Competitor reference", 1, "g"], ["Basic substitutes; our feature premium", 2, "m"], ["Customer value ceiling", 1, "gr"], ["Willingness to pay; demand at each price", 2, "m"], ["Launch economics", 1, "v"], ["Profit and breakeven at chosen price", 2, "m"]]) + `<p style="margin-top:8px">Hypothesis to state: a value-based price above cost-plus will earn more, as long as demand doesn't fall too fast.</p>`,
    steps: [
      { kind: "mc", label: "Exhibit 1: Customer survey", pre: `Survey of the ${units(N)} target customers. Annual fixed costs for the product line: ${$m(F)}.`,
        exhibit: fig("Share of target customers who would buy, by price", hbars({ rows: P.map((p, i) => [money(p), T[i]]), suf: "%" })) + table(["Price", "% of customers who would buy", "Contribution per unit"], P.map((p, i) => [money(p), T[i] + "%", money(p - c)]), [1, 2]),
        q: "Which price maximizes annual profit?", opts: P.map((_, i) => lab(i)), right: best,
        sol: P.map((p, i) => `${money(p)}: ${units(N)} × ${T[i]}% × ${money(p - c)} = ${$m(contrib[i])}`).join(" · ") + ". Fixed costs are the same at every price, so the highest contribution wins." },
      { kind: "num", label: "Profit", q: "What is annual profit at that price, after fixed costs? ($M)", ans: prof, traps: [[contrib[best], "That's contribution before fixed costs. Subtract the fixed costs."]], tol: Math.max(Math.abs(prof) * 0.03, 0.05),
        sol: `${$m(contrib[best])} contribution − ${$m(F)} fixed = ${$m(prof)}.` },
      { kind: "num", label: "Breakeven", q: "How many units must sell at that price to break even? (thousands)", ans: be * 1000, tol: be * 1000 * 0.03,
        sol: `${$m(F)} ÷ ${money(P[best] - c)} per unit = ${fmt(be * 1000, 0)}K units, versus about ${fmt(N * T[best] / 100 * 1000, 0)}K expected buyers.` },
      { kind: "brain", label: "Brainstorm", q: "What could make the survey price wrong in the real market?",
        ideas: ["<b>Survey bias:</b> people overstate intent; small or unrepresentative sample", "<b>Competitors:</b> price cuts or a feature-matched launch", "<b>Channel:</b> retailer or distributor margins change the shelf price", "<b>Customer economics:</b> budget cycles; who pays vs. who uses", "<b>Strategy:</b> launch higher and discount later vs. launch low to build share"] },
      { kind: "rec", label: "Recommendation", q: "Recommend a price to leadership.",
        model: `Launch at ${money(P[best])}. At that price ${T[best]}% of the ${units(N)} target customers say they'd buy, giving the highest contribution, ${$m(contrib[best])}, and about ${$m(prof)} of profit after ${$m(F)} of fixed costs. Breakeven is ${fmt(be * 1000, 0)}K units, well within reach. ${best > 0 ? `A cost-plus price near ${money(P[0])} would leave about ${$m(contrib[best] - contrib[0])} of contribution on the table.` : "Higher prices lose too many buyers to be worth it."} Risk: surveys overstate intent, so run a priced pilot in one region first.` },
    ],
  };
}

function genMA(r, I) {
  const tgt = `${pick(r, ["Apex", "Meridian", "Northstar", "Bluewater", "Ironbridge", "Summit"])} ${I.tgt}`;
  const R = sig(I.price * I.vol * pick(r, [0.25, 0.35, 0.5]));
  const e = pick(r, [0.12, 0.15, 0.18, 0.2]), EB = R * e, k = pick(r, [6, 8, 10]);
  const cogs = sig(R * pick(r, [0.55, 0.6])), pp = pick(r, [2, 3, 4]), sga = sig(R * pick(r, [0.02, 0.03]));
  const syn = cogs * pp / 100 + sga, integ = sig(syn * pick(r, [1, 1.5, 2]));
  const stand = EB * k, maxP = stand + syn * k - integ;
  const ask = sig(maxP * pick(r, [0.85, 0.92, 1.1, 1.2]));
  const buy = ask <= maxP;
  return {
    title: `${I.name}: acquiring ${tgt}`, decision: buy ? "yes" : "no",
    prompt: `${I.name}, ${I.what}, is considering acquiring ${tgt}, a smaller competitor strong in ${I.segs[1].toLowerCase()}. The owners are asking ${$m(ask)}. Should ${I.name} buy?`,
    clarify: [
      ["Why does the client want this?", `To grow in ${I.segs[1].toLowerCase()} faster than it could alone, and to gain scale in purchasing.`],
      ["How is the target performing?", "Growing slightly faster than the market with stable margins."],
      ["How will we value it?", `Comparable companies trade at about ${k}× EBITDA. Use that multiple for synergies too.`],
      ["Any regulatory concerns?", "Antitrust review is not expected to be an issue."],
      ["Integration plans?", "Full integration: shared purchasing and a combined back office."],
    ],
    structure: tree([["Should we acquire?", 0, "b"], ["Strategic fit", 1, "g"], ["Gap it fills; alternatives", 2, "m"], ["Standalone value", 1, "gr"], ["Revenue, EBITDA, multiple", 2, "m"], ["Synergies", 1, "b"], ["Purchasing savings, overhead overlap; integration cost", 2, "m"], ["Price and risks", 1, "r"], ["Max price vs. asking; culture, customers, talent", 2, "m"]]) + `<p style="margin-top:8px">Hypothesis to state: the deal makes sense only if standalone value plus synergies exceeds the asking price.</p>`,
    steps: [
      { kind: "num", label: `Exhibit 1: ${tgt} financials`,
        exhibit: table(["Metric", "Value"], [["Revenue", $m(R)], ["EBITDA margin", fmt(e * 100) + "%"], ["Comparable EV/EBITDA multiple", k + "×"]], [1]),
        q: "What is the target's standalone value? ($M)", ans: stand, traps: [[EB, "That's EBITDA. Multiply it by the valuation multiple."], [R * k, "You multiplied revenue by the multiple. Use EBITDA (revenue × margin) instead."]], tol: stand * 0.02,
        sol: `EBITDA: ${$m(R)} × ${fmt(e * 100)}% = ${$m(EB)}. Value: ${$m(EB)} × ${k} = ${$m(stand)}.` },
      { kind: "num", label: "Exhibit 2: Synergy estimates",
        exhibit: table(["Synergy", "Basis"], [["Purchasing savings", `${pp}% of target's ${$m(cogs)} cost of goods`], ["Back-office overlap", `${$m(sga)} per year`], ["One-time integration cost", $m(integ)]]),
        q: "What are total annual synergies? ($M)", ans: syn, traps: [[cogs * pp / 100, "That's only the purchasing savings. Add the back-office overlap."], [syn * k, "You've already valued them with the multiple. The question asks for annual synergies."]], tol: Math.max(syn * 0.03, 0.05),
        sol: `${$m(cogs)} × ${pp}% = ${$m(cogs * pp / 100)}, plus ${$m(sga)} = ${$m(syn)} a year.` },
      { kind: "num", label: "Maximum price", q: "What is the most the client should pay? ($M)", ans: maxP, traps: [[stand + syn * k, "Close, but you forgot to subtract the one-time integration cost."], [stand + syn - integ, "Synergies are yearly. Value them with the same multiple before adding."], [stand, "That's standalone value only. Add the value of synergies, minus integration cost."]], tol: maxP * 0.02,
        sol: `Standalone ${$m(stand)} + synergies ${$m(syn)} × ${k} = ${$m(syn * k)}, minus integration ${$m(integ)} = ${$m(maxP)}.` },
      { kind: "mc", label: "Decision", q: `The asking price is ${$m(ask)}. What should the client do?`, opts: ["Buy at the asking price", "Walk away or renegotiate"], right: buy ? 0 : 1,
        sol: buy ? `${$m(ask)} is below the ${$m(maxP)} maximum, but it still hands ${fmt((ask - stand) / (syn * k) * 100, 0)}% of synergy value to the seller. Buy, while negotiating down if possible.` : `${$m(ask)} is above the ${$m(maxP)} maximum, so the client would destroy value even if every synergy is captured.` },
      { kind: "brain", label: "Brainstorm", q: "What could stop the client from capturing these synergies?",
        ideas: ["<b>People:</b> key salespeople or engineers leave; culture clash", "<b>Customers:</b> target's customers switch suppliers after the deal", "<b>Operations:</b> incompatible systems; supplier contracts that can't be moved", "<b>Execution:</b> management distracted from the core business; slower timeline than planned"] },
      { kind: "rec", label: "Recommendation", q: "Give the board your recommendation.",
        model: buy
          ? `Buy ${tgt}, but negotiate. It is worth ${$m(stand)} on its own and ${$m(maxP)} to us with ${$m(syn)} a year of synergies, so the ${$m(ask)} ask is within our limit. The risk is that synergies arrive late or customers leave, so I'd open lower, tie part of the price to an earn-out, and lock in key staff. Next step: confirmatory diligence on the purchasing savings.`
          : `Don't buy at ${$m(ask)}. Even with every synergy captured, ${tgt} is worth at most ${$m(maxP)} to us (${$m(stand)} standalone plus ${$m(syn * k - integ)} net synergy value). Paying the ask would transfer more than all the value to the seller. Counter at or below ${$m(maxP)}, ideally with an earn-out, or pursue organic growth in ${I.segs[1].toLowerCase()} instead.` },
    ],
  };
}

function genOps(r, I) {
  const L = pick(r, [3, 4, 5, 6]), Hh = pick(r, [16, 20]), D = pick(r, [250, 300]);
  const u = I.rate, up = pick(r, [0.7, 0.75, 0.8]), df = pick(r, [0.04, 0.06, 0.08, 0.1]);
  const raw = L * Hh * D * u;
  const good = raw * up * (1 - df);
  const big = good >= 5e6, div = big ? 1e6 : 1e3, uL = big ? "millions" : "thousands";
  const cmU = I.price - I.vc;
  const gU = raw * 0.1 * (1 - df), gD = raw * up * (df / 2);
  const vU = gU * cmU / 1e6, vD = gD * cmU / 1e6;
  const cU = sig(vU * pick(r, [1, 1.5, 2])), cD = sig(vD * pick(r, [1, 1.5, 2]));
  const pbU = cU / vU, pbD = cD / vD, first = pbU <= pbD ? 0 : 1;
  return {
    title: `${I.name}: plant output`, decision: null,
    prompt: `${I.name}, ${I.what}, can't make enough product to meet demand at its main plant. A new line would take two years. The plant manager wants to know how much more output they can get from the existing plant, and which improvement to fund first.`,
    clarify: [
      ["What is the objective?", "Increase sellable output as fast as possible at reasonable cost."],
      ["Is demand really above capacity?", "Yes. Every extra good unit produced can be sold."],
      ["What is the margin per unit?", `Each good unit earns ${money(cmU)} of contribution.`],
      ["What limits output today?", "Lines stop often for breakdowns and changeovers, and some output is scrapped for defects."],
      ["Any budget limits?", "They can fund one improvement program this year."],
    ],
    structure: tree([["Raise good output", 0, "b"], ["Capacity", 1, "g"], ["Lines × hours × rated speed", 2, "m"], ["Uptime", 1, "gr"], ["Breakdowns, changeovers, staffing gaps", 2, "m"], ["Yield", 1, "r"], ["Defects and scrap", 2, "m"], ["Choosing a fix", 1, "v"], ["Gain vs. cost (payback)", 2, "m"]]) + `<p style="margin-top:8px">Hypothesis to state: uptime is the bigger lever, but the cheaper fix may pay back faster. Start by calculating current good output.</p>`,
    steps: [
      { kind: "num", label: "Exhibit 1: Plant data",
        exhibit: table(["Metric", "Value"], [["Production lines", L], ["Operating hours per day", Hh], ["Operating days per year", D], ["Rated speed per line", fmt(u, 0) + " units/hour"], ["Uptime (share of hours running)", fmt(up * 100) + "%"], ["Defect rate", fmt(df * 100) + "%"]], [1]),
        q: `What is current good output per year? (${uL} of units)`, ans: good / div, traps: [[raw / div, "That's output at full speed. Apply uptime and the defect rate."], [raw * up / div, "Almost. You applied uptime but not the defect rate."]], tol: good / div * 0.02,
        sol: `${L} × ${Hh} × ${D} × ${fmt(u, 0)} = ${fmt(raw / div)} ${uL} at full speed. × ${fmt(up * 100)}% uptime × ${fmt((1 - df) * 100)}% good = ${fmt(good / div)} ${uL}.` },
      { kind: "num", label: "Option A: Uptime program", q: `A maintenance program raises uptime by 10 points. How much extra annual profit? ($M)`, ans: vU, traps: [[gU / 1e6, "That's extra units (in millions), not profit. Multiply by contribution per unit."]], tol: Math.max(vU * 0.03, 0.05),
        sol: `Extra good units: ${fmt(raw / div)} ${uL} × 10% × ${fmt((1 - df) * 100)}% = ${fmt(gU / div)} ${uL}. × ${money(cmU)} = ${$m(vU)}.` },
      { kind: "num", label: "Option B: Quality program", q: "A quality program halves the defect rate. How much extra annual profit? ($M)", ans: vD, tol: Math.max(vD * 0.03, 0.05),
        sol: `Extra good units: ${fmt(raw / div)} ${uL} × ${fmt(up * 100)}% × ${fmt(df * 50)}% = ${fmt(gD / div)} ${uL}. × ${money(cmU)} = ${$m(vD)}.` },
      { kind: "mc", label: "Exhibit 2: Program costs", pre: table(["Program", "One-time cost"], [["A: Uptime (maintenance)", $m(cU)], ["B: Quality (defects)", $m(cD)]], [1]),
        q: "Which program should the plant fund first, based on payback?", opts: ["A: Uptime program", "B: Quality program"], right: first,
        sol: `A pays back in ${fmt(pbU)} years (${$m(cU)} ÷ ${$m(vU)}); B in ${fmt(pbD)} years (${$m(cD)} ÷ ${$m(vD)}).` },
      { kind: "brain", label: "Brainstorm", q: "What typically causes low uptime, and how would you fix it?",
        ideas: ["<b>Breakdowns:</b> preventive and predictive maintenance; spare-parts stocking", "<b>Changeovers:</b> quick-changeover methods (SMED); fewer, longer runs", "<b>Starvation:</b> material shortages from upstream; better scheduling and buffers", "<b>People:</b> unfilled shifts, training gaps, breaks not staggered"] },
      { kind: "rec", label: "Recommendation", q: "Recommend a plan to the plant manager.",
        model: `Fund the ${first === 0 ? "uptime" : "quality"} program first. The plant makes ${fmt(good / div)} ${uL} good units a year today. The ${first === 0 ? "uptime" : "quality"} program adds ${$m(first === 0 ? vU : vD)} of profit a year and pays back in ${fmt(Math.min(pbU, pbD))} years, versus ${fmt(Math.max(pbU, pbD))} for the alternative. Together they add about ${$m(vU + vD)} a year, so fund the second from the first one's savings. Risk: both programs need line downtime to implement, so schedule them in low-demand weeks. Next step: a bottleneck study to confirm which line loses the most hours.` },
    ],
  };
}

const GENS = { PRF: genProfit, ENT: genEntry, PRC: genPricing, MNA: genMA, OPS: genOps };
const TIPS = {
  clarify: "Start by repeating the prompt in your own words. Then ask 2–3 questions, either by clicking one or typing your own.",
  structure: "Write 3–4 pieces that don't overlap, one per line. For a profit problem, start with revenue vs. costs. End with your best guess and where you'd start.",
  num: "Write the formula first, then plug in numbers from the table. Watch the units: M = millions, K = thousands.",
  mc: "Use the numbers you just worked out. Which change is the biggest?",
  brain: "Name 2–3 groups first (for example, inside vs. outside the company), then put ideas under each. Finish with the one you'd test first.",
  insight: "Read the title and units first. Then lead with the biggest change, quote a number, and say what it means for the client.",
  rec: "Start with “The client should…”, give 2–3 reasons with numbers, one risk, and one next step.",
};
const tipBox = k => G.guided && !G.reveal ? `<div class="tip"><b>Tip:</b> ${TIPS[k]}</div>` : "";
const G = { guided: true, caseObj: null, code: "", reveal: false, t0: 0, timer: null, score: { right: 0, tried: 0 }, fb: {} };

function makeCase(type, indIdx, seed) {
  if (type === "OPS" && !IND[indIdx].mfg) indIdx = [0, 1, 4, 5][seed % 4];
  const r = mulberry(seed * 7919 + indIdx * 31 + type.charCodeAt(0));
  G.caseObj = GENS[type](r, IND[indIdx]);
  G.code = `${type}-${indIdx + 1}-${seed}`;
  G.type = type; G.src = "gen"; G.libOpen = false;
  G.caseObj.typeLabel = CTYPES.find(t => t.id === type).label;
}

/* ---------- case text for the AI coach */
const strip = h => String(h).replace(/<\/(tr|p|div|li|h\d)>/g, "\n").replace(/<\/t[dh]>/g, " | ").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/[ \t]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
function caseContext(C) {
  return [`Title: ${C.title}`, `Prompt: ${C.prompt}`,
    "Clarifying facts:\n" + C.clarify.map(([q, a]) => `- ${q} ${a}`).join("\n"),
    "Model structure:\n" + strip(C.structure),
    ...C.steps.map((s, i) => `Step ${i + 1} (${s.label}): ${strip(s.pre || "")}\n${strip(s.exhibit || "")}\nQuestion: ${s.q}\n` +
      (s.kind === "num" ? `Answer: ${fmt(s.ans, 2)}. Solution: ${strip(s.sol)}` : s.kind === "mc" ? `Correct option: ${strip(s.opts[s.right])}. ${strip(s.sol)}` : s.kind === "brain" ? "Model ideas: " + s.ideas.map(strip).join("; ") : s.kind === "insight" ? "Model insight: " + strip(s.model) : "Model recommendation: " + strip(s.model))),
  ].join("\n\n");
}

/* ---------- offline assessment (always available) */
const KW = {
  PRF: [["revenue", ["revenue", "sales", "price", "volume"]], ["costs", ["cost", "expense", "fixed", "variable"]]],
  ENT: [["market size and growth", ["market", "size", "demand", "growth"]], ["competition", ["compet", "rival", "player", "incumbent"]], ["the client's ability to win", ["capab", "abilit", "win ", "winning", "strength", "brand", " fit", "skill", "advantage"]], ["the economics", ["profit", "econom", "payback", "invest", "return", "cost"]]],
  PRC: [["costs", ["cost", "margin"]], ["competitor prices", ["compet", "substitut", "rival", "alternative"]], ["customer value", ["value", "willing", "survey", "customer", "demand"]]],
  MNA: [["the target's value", ["value", "valuation", "ebitda", "multiple", "worth", "financ"]], ["synergies", ["synerg", "saving", "combin"]], ["price vs. value", ["price", "ask", "premium", "pay"]], ["risks and integration", ["risk", "integrat", "culture", "talent", "retain"]]],
  OPS: [["capacity", ["capacity", "speed", "lines", "hours", "throughput"]], ["uptime", ["uptime", "downtime", "breakdown", "maintenance"]], ["quality", ["defect", "quality", "yield", "scrap"]], ["cost of fixes", ["cost", "payback", "invest", "budget"]]],
};
const items = t => { let a = t.split(/\n|;|•/).map(x => x.trim()).filter(x => x.replace(/[^a-z]/gi, "").length > 2); if (a.length < 2) a = t.split(/,| and /).map(x => x.trim()).filter(x => x.length > 2); return a; };
const hasAny = (t, ws) => ws.some(w => t.includes(w));
function offlineAssess(kind, text, step = {}) {
  const C = G.caseObj, t = text.toLowerCase(), wc = text.trim().split(/\s+/).filter(Boolean).length;
  const worked = [], fix = []; let score = 1, say = "";
  if (wc < 5) return { score: 1, verdict: "There isn't enough here to assess yet.", worked: [], fix: ["Write a few lines in full sentences or bullet points, then ask for feedback again."], interviewer: "Take your time. Walk me through how you'd approach it.", source: "Quick check" };
  const specific = hasAny(t, C.words || [C.title.split(":")[0].toLowerCase().split(" ")[0], ...IND.flatMap(i => i.segs).map(s => s.toLowerCase().split(" ")[0])]);
  if (kind === "structure") {
    const n = items(text).length, groups = C.kw || KW[G.type], hit = groups.filter(([, w]) => hasAny(t, w)), miss = groups.filter(g => !hit.includes(g));
    const hyp = /hypothes|i think|i suspect|my guess|likely|i'd start|i would start|start with|first look/.test(t);
    if (n >= 2 && n <= 6) { score++; worked.push(`You broke the problem into ${n} pieces, which is a manageable number.`); } else fix.push(n < 2 ? "Split your thinking into 3–4 separate pieces, one per line, so the structure is visible." : `You listed ${n} items. Group them into 3–4 bigger buckets so it's easier to follow.`);
    if (hit.length >= Math.ceil(groups.length * 0.6)) { score++; worked.push(`You covered ${hit.map(h => h[0]).join(", ")}.`); }
    if (miss.length) fix.push(`Nothing in your structure covers ${miss.map(m => m[0]).join(" or ")}. Could the answer be hiding there?`);
    if (hyp) { score++; worked.push("You said where you'd start, which shows a hypothesis."); } else fix.push("End with your best guess and where you'll start: “My hypothesis is…, so I'll look at … first.”");
    if (specific) { score++; worked.push("You used details from this case, so it doesn't sound memorized."); } else fix.push("Use the client's own details (its name, segments or numbers) so the structure fits this case.");
    say = !hyp ? "Okay. Where would you like to start, and why there?" : miss.length ? `Got it. Before we dive in, what about ${miss[0][0]}?` : "Makes sense. Let's go where you suggested.";
  } else if (kind === "insight") {
    const keys = step.keys || [], hit = keys.filter(([, w]) => hasAny(t, w)), miss = keys.filter(k => !hit.includes(k));
    const nums = (text.match(/\d[\d,.]*/g) || []).length;
    score = 1 + hit.length + (nums >= 1 ? 1 : 0);
    if (hit.length) worked.push(`You covered ${hit.map(h => h[0]).join("; ")}.`);
    if (nums >= 1) worked.push("You used numbers from the exhibit."); else fix.push("Quote at least one number from the exhibit so your insight is concrete.");
    miss.forEach(m => fix.push(`Add ${m[0]}.`));
    if (!/^\s*\S[^.!?]{0,160}(drop|fell|grew|rose|declin|increas|biggest|most|peak|gap|explain|driv)/i.test(text)) fix.push("Lead with the single biggest takeaway in your first sentence.");
    say = miss.length ? `What else stands out to you? Think about ${miss[0][0]}.` : "Good read. What would you want to look at next?";
  } else if (kind === "brain") {
    const lines = items(text), n = lines.length;
    const grouped = /:/.test(text) || /internal|external|inside|outside|customer|competitor|company|short[- ]term|long[- ]term|market|operation|people|financial/.test(t);
    const prio = /first|priorit|most likely|start with|biggest|i'd test|i would test|focus on/.test(t);
    if (n >= 4) { score++; worked.push(`You came up with about ${n} ideas.`); } else fix.push("Aim for at least 6 ideas. Interviewers reward breadth here.");
    if (n >= 7) score++;
    if (grouped) { score++; worked.push("Your ideas are organized into groups."); } else fix.push("Start with 2–3 group names (for example, inside vs. outside the company), then put ideas under each.");
    if (prio) { score++; worked.push("You prioritized an idea, which shows judgment."); } else fix.push("Finish by naming the idea you'd test first and why.");
    say = prio ? "Good. How would you test that first idea quickly?" : "Of all of those, which would you look into first?";
  } else {
    const first = text.split(/(?<=[.!?])\s/)[0].toLowerCase();
    const answerFirst = /should|recommend|advise|go ahead|proceed|don't|do not|must|need to/.test(first);
    const nums = (text.match(/\$?\d[\d,.]*\s?(%|m|k|b|x|years?)?/gi) || []).length;
    const risk = /risk|concern|downside|challenge|watch out|danger|could fail|threat/.test(t);
    const next = /next step|next,|pilot|test|validate|confirm|first step|follow up|then i'd|then we/.test(t);
    if (answerFirst) { score++; worked.push("Your first sentence gives the answer."); } else fix.push("Move your answer to the first sentence: “The client should…”. Right now it comes later or not at all.");
    if (nums >= 2) { score++; worked.push(`You backed it up with ${nums} numbers from the case.`); } else fix.push("Use at least two numbers you calculated to support your answer.");
    if (risk) { score++; worked.push("You named a risk."); } else fix.push("Add one risk and how you'd manage it.");
    if (next) { score++; worked.push("You gave a next step."); } else fix.push("Close with a concrete next step, like a pilot or an analysis to confirm.");
    if (wc > 150) fix.push(`At ${wc} words this would run long out loud. Aim for under 120.`);
    if (C.decision) {
      const neg = /(should not|shouldn't|don't|do not|not (to )?(enter|buy|acquire|proceed)|walk away|pass on|reject|renegotiat|decline|hold off|counter)/.test(t);
      if ((neg ? "no" : "yes") !== C.decision) { score = Math.min(score, 2); const d = C.steps.find(s => s.kind === "mc"); fix.unshift(`Check your conclusion. The numbers point the other way: ${strip(d.sol)}`); }
      else worked.unshift("Your conclusion matches what the numbers say.");
    }
    if (C.focus && !C.focus.some(f => t.replace(/,/g, "").includes(String(f).toLowerCase().replace(/,/g, "")))) fix.push(`Name the main driver you found (${C.focus[0]}) so the CEO knows why.`);
    say = !answerFirst ? "So what's your answer? Should they do it or not?" : !risk ? "What's the biggest thing that could go wrong?" : "Clear. If you had one more week, what would you check?";
  }
  score = Math.max(1, Math.min(5, score));
  const verdict = ["", "This needs work before it would hold up in an interview.", "A start, but key pieces are missing.", "Solid. A couple of fixes would make it strong.", "Strong answer with one or two things to sharpen.", "Interview-ready."][score];
  return { score, verdict, worked, fix, interviewer: say, source: "Quick check" };
}

/* ---------- AI coach (when Claude is available) */
const CRIT = {
  structure: "MECE (no overlap, nothing important missing); specific to this client rather than a generic framework; enough detail under each piece; states a hypothesis and where to start",
  brain: "number of ideas; organized into clear groups; specific to this client; prioritizes one idea with a reason",
  rec: "answer first; conclusion consistent with the case numbers; 2–3 reasons using numbers from the case; one risk with a mitigation; one concrete next step; concise enough to say in under a minute",
  insight: "leads with the single most important pattern in the exhibit; quotes specific numbers; explains what it means for the client (the so-what); proposes what to look at next; consistent with the model insight",
};
async function aiAssess(kind, text, q) {
  const prompt = `You are an experienced, encouraging consulting case coach working with a university student who may be new to cases. The student typed an answer during a practice case. Assess it.

CASE (facts, solutions and model answers are for your reference; don't paste them back in full):
${caseContext(G.caseObj)}

STAGE: ${kind === "structure" ? "Structure" : kind === "brain" ? "Brainstorm" : kind === "insight" ? "Reading an exhibit (insight)" : "Final recommendation"}
QUESTION ASKED: ${q}
STUDENT ANSWER:
"""${text.slice(0, 4000)}"""

Judge against: ${CRIT[kind]}.
Tailor every point to what this student actually wrote: refer to their specific words or ideas, note what's missing compared with the model, and keep suggestions concrete and beginner-friendly. If the answer is empty, off-topic, or just a question, say so kindly.

Reply with only a JSON object:
{"score": integer 1-5, "verdict": "one short sentence", "worked": ["1-3 specific strengths"], "fix": ["1-3 specific, actionable improvements"], "interviewer": "what the interviewer would say back right now, in character, 1-2 sentences, usually a probing follow-up question"}`;
  const r = await AI.sample.json(prompt, { cache: false });
  return { score: Math.max(1, Math.min(5, Math.round(+r.score || 1))), verdict: String(r.verdict || ""), worked: (r.worked || []).map(String), fix: (r.fix || []).map(String), interviewer: String(r.interviewer || ""), source: "AI coach" };
}
async function assess(kind, text, q, step) {
  if (G.useAI && AI.sample) {
    try { return await aiAssess(kind, text, q); }
    catch (e) { const res = offlineAssess(kind, text, step); res.note = e && e.code === "not_granted" ? "AI coaching wasn't allowed, so this is the built-in quick check." : "The AI coach couldn't respond, so this is the built-in quick check."; if (e && e.code === "not_granted") G.useAI = false; return res; }
  }
  return offlineAssess(kind, text, step);
}
function fbHTML(r) {
  const tone = r.score >= 4 ? "" : r.score === 3 ? "mid" : "low";
  return `<div class="fbk"><div class="fbk-h"><span class="dots ${tone}" aria-label="${r.score} out of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= r.score ? "on" : ""}"></i>`).join("")}</span><b>${esc(r.verdict)}</b><span class="badge ${r.source === "AI coach" ? "green" : ""}">${r.source}</span></div>
  <div class="g2"><div><h5 style="color:var(--green)">What worked</h5>${r.worked.length ? ul(r.worked.map(esc), "green") : `<p class="small" style="margin:0">Nothing yet. Start with the suggestions.</p>`}</div><div><h5 style="color:var(--gold)">To improve</h5>${r.fix.length ? ul(r.fix.map(esc), "gold") : `<p class="small" style="margin:0">Nothing major. Nice work.</p>`}</div></div>
  ${r.interviewer ? `<div class="say"><div class="av">I</div><p><b>Interviewer:</b> “${esc(r.interviewer)}”</p></div>` : ""}
  ${r.note ? `<p class="small faint" style="margin:8px 0 0">${r.note}</p>` : ""}
  <p class="small faint" style="margin:8px 0 0">Edit your answer above and ask again, or compare with the model answer.</p></div>`;
}

/* ---------- clarifying questions */
const STOP = new Set("the a an is are was were what how why when who do does did to of in on for and or our their they client company it this that any there be have has with about you your can could would i we".split(" "));
const toks = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.replace(/(ing|ed|es|s)$/, ""));
const SYN = { goal: ["objective", "success", "aim", "target", "want", "trying", "achieve"], competitor: ["competitor", "industry", "rival", "other", "market"], money: ["make", "money", "business", "model", "sell", "revenue", "product"], change: ["change", "recent", "new", "happen", "why", "cause"], where: ["where", "geograph", "country", "region", "operate", "location"], time: ["time", "when", "long", "horizon", "year"] };
function matchClarify(q, C) {
  const qt = toks(q), expand = new Set(qt);
  Object.entries(SYN).forEach(([k, g0]) => { const g = [k, ...g0]; if (g.some(w => qt.some(t => t.length > 2 && (t.startsWith(w) || w.startsWith(t))))) g.forEach(w => expand.add(w)); });
  let best = -1, bs = 0;
  C.clarify.forEach(([cq, ca], i) => { const ct = toks(cq + " " + ca); const s = ct.filter(t => [...expand].some(e => e.length > 3 && (t.startsWith(e) || e.startsWith(t)))).length; if (s > bs) { bs = s; best = i; } });
  return bs >= 1 ? best : -1;
}
async function askClarify(q) {
  const C = G.caseObj, out = $("#qa");
  out.insertAdjacentHTML("beforeend", `<div><b>You asked: ${esc(q)}</b><span class="faint">Thinking…</span></div>`);
  const slot = out.lastElementChild.querySelector("span");
  if (G.useAI && AI.sample) {
    try {
      const { text } = await AI.sample(`You are the interviewer in a consulting case practice with a student. Answer the candidate's clarifying question in 1–2 short sentences, in character. Use the case facts below. If a fact isn't specified, give a reasonable answer consistent with the case, or say it isn't important for this case. Do not reveal exhibit numbers, solutions or the recommendation; if they ask for data that appears in an exhibit, say you'll share data once they've laid out their structure.\n\nCASE:\n${caseContext(C)}\n\nCANDIDATE'S QUESTION: ${q}`, { modelTier: "quick" });
      slot.className = ""; slot.textContent = text.trim(); return;
    } catch (e) { if (e && e.code === "not_granted") G.useAI = false; }
  }
  const i = matchClarify(q, C);
  slot.className = "";
  if (i >= 0) { slot.textContent = C.clarify[i][1]; const chip = $(`[data-cq="${i}"]`); if (chip) chip.setAttribute("aria-pressed", "true"); }
  else slot.textContent = "That isn't something we have information on, or it won't matter much here. Try asking about the goal, how the client makes money, competitors, or what changed recently.";
}

function stepBody(s, i) {

function diagnose(v, s) {

    if (ar > 0.9 && ar < 1.1) return "Very close. Check your rounding, or redo the last step more carefully.";

function wireCase() {

    if (ok) unlockAfter(i);

function scoreCard() {
  return `<p>Here's how this case went. Rate yourself honestly (or have your partner rate you), then try another case of your weakest type.</p><div id="sc-out" style="margin-bottom:14px"></div>
  <div class="score">${RUBRIC.map((r, i) => `<label for="rb-${i}" class="muted small">${r}</label><select id="rb-${i}"><option value="0">Not yet</option><option value="1" selected>Partly</option><option value="2">Yes</option></select>`).join("")}</div>
  <div class="row" style="margin-top:14px">${G.src === "lib" ? `<button class="btn sm" data-libback="1">Back to the case library</button>` : `<button class="btn sm" id="gen-again">Generate another case</button>`}<button class="btn sm ghost" data-go="types">Review case types</button></div>`;
}
function updScore() {
  const out = $("#sc-out"); if (!out) return;
  const sel = $$("#st-end select"); const tot = sel.reduce((a, s) => a + +s.value, 0), max = sel.length * 2;
  const fbs = Object.values(G.fb), avg = fbs.length ? (fbs.reduce((a, b) => a + b, 0) / fbs.length) : null;
  out.innerHTML = `<div class="stats3"><div><b>${G.score.right}/${G.score.tried}</b><span>math & judgment correct</span></div><div><b>${avg === null ? "–" : avg.toFixed(1) + "/5"}</b><span>avg written feedback</span></div><div><b>${tot}/${max}</b><span>self-rating</span></div></div>`;
  const ag = $("#gen-again"); if (ag) ag.onclick = () => { const g = $("#gen-go"); if (g) g.click(); };
}

      exhibit: chain([["People in the service area", "1.2M"], ["Share who ride scooters", "10%"], ["Rides per rider per month", "4"], ["Revenue per ride", "?"]]),
      q: "What is the annual market size in revenue? ($M)", ans: 1.2e6 * 0.1 * 4 * 12 * 5 / 1e6, tol: 0.5,
      traps: [[1.2e6 * 0.1 * 4 * 5 / 1e6, "That's monthly revenue. Multiply by 12."], [1.2e6 * 0.1 * 4 * 12 / 1e6, "That's the number of rides (millions). Multiply by $5 per ride."], [1.2e6 * 0.1 * 4 * 12 * 4 / 1e6, "Revenue per ride is $1 + $0.40 × 10 = $5, not $4."]],
      sol: "Revenue per ride: $1 + $0.40 × 10 = $5. Riders: 1.2M × 10% = 120K. Rides: 120K × 4 × 12 = 5.76M a year. Market: 5.76M × $5 = <b>$28.8M a year</b>." },
    { kind: "insight", label: "Exhibit 2: Seasonality",
      exhibit: fig("Monthly scooter rides in Atlanta, all operators (thousands)", lineChart({ x: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], series: [{ vals: [300, 320, 420, 520, 600, 620, 610, 600, 560, 480, 380, 350] }] })),
      q: "What do you notice, and why does it matter for VoltRide?",
      keys: [["seasonality (summer peak, winter low)", ["summer", "season", "winter", "peak", "warm", "cold"]], ["the size of the swing (about 2×)", ["600", "300", "620", "double", "twice", "2x"]], ["an implication for the plan", ["fleet", "fixed", "launch", "spring", "cash", "staff", "cap", "plan"]]],
      model: "Ridership is very seasonal: summer months run around 600K rides, about double January's 300K. That matters because fixed costs like the warehouse and staff run all year, so winter months may lose money. It also supports a spring launch, so VoltRide builds awareness during peak demand. I'd check whether the 1,000-scooter cap limits us in summer." },
    { kind: "num", label: "Exhibit 3: VoltRide's Atlanta plan",
      exhibit: kt([["Assumption", "Value"], ["Target market share (year 2)", "25%"], ["Cost per ride: charging, repairs, moving scooters", "$2.50"], ["Scooter replacement: 1,000 × $600, replaced yearly", "$0.6M / yr"], ["Fixed costs: warehouse, staff, permit", "$1.8M / yr"], ["Upfront launch investment", "$5M"]]),
      q: "What annual operating profit would VoltRide earn at 25% share? ($M)", ans: 7.2 - 3.6 - 0.6 - 1.8, tol: 0.08,
      traps: [[3.6, "That's revenue minus per-ride costs. Subtract scooter replacement and fixed costs too."], [3.0, "You left out the $1.8M of fixed costs."], [1.8, "You left out scooter replacement, $0.6M."], [7.2, "That's revenue. Subtract the costs."]],
      sol: "Revenue: $28.8M × 25% = $7.2M. Rides: 1.44M × $2.50 = $3.6M. Profit = 7.2 − 3.6 − 0.6 − 1.8 = <b>$1.2M a year</b>." + fig("From revenue to profit ($M)", waterfall({ items: [["Revenue", 7.2, "total"], ["Per-ride costs", -3.6], ["Scooters", -0.6], ["Fixed costs", -1.8], ["Profit", 1.2, "total"]], dec: 1 })) },
    { kind: "num", label: "Payback", q: "What's the payback period on the $5M launch investment? (years)", ans: 5 / 1.2, tol: 0.08,
      traps: [[5 / 3.6, "You used profit before scooter and fixed costs. Use the $1.2M."], [1.2 / 5, "Flip it: investment ÷ yearly profit."]],
      sol: "$5M ÷ $1.2M ≈ <b>4.2 years</b>, beyond the board's 3-year limit." },
    { kind: "mc", label: "What would change the answer?",
      pre: "To pay back in 3 years, VoltRide needs at least $1.67M of profit a year.",
      q: "Which change, on its own, gets VoltRide under 3 years?", opts: ["Reach 30% share instead of 25%", "Cut fixed costs by $0.3M", "Lower the per-minute price to win share", "Spend more on launch marketing"], right: 0,
      sol: "Each share point adds $288K of revenue and $144K of costs, so +5 points adds $0.72M: profit $1.92M, payback 2.6 years. Cutting fixed costs $0.3M only reaches $1.5M (3.3 years). Lower prices shrink margin per ride, and more marketing raises the investment.",
      bonus: ["What share does VoltRide need to break even on a 3-year payback?", "Profit = 28.8 × s × ($5 − $2.50)/$5 − 2.4 = 14.4 × s − 2.4 ≥ 1.67 → s ≥ about 28%."] },
    { kind: "brain", label: "Brainstorm", q: "Beyond the numbers, what risks should VoltRide weigh before applying?",
      ideas: ["<b>Market:</b> weather and seasonality, ridership fading after the novelty", "<b>Competitors:</b> price war from the two incumbents, exclusive campus deals (GSU, Georgia Tech)", "<b>Regulation:</b> lower fleet caps, sidewalk bans, permit not renewed", "<b>Operations:</b> vandalism and theft, charging logistics, hiring local staff", "<b>Biggest:</b> an incumbent price war, since our plan depends on taking share"] },
    { kind: "rec", label: "Recommendation", q: "Give the board your recommendation.",
      model: "VoltRide shouldn't enter Atlanta on the current plan, but should apply if it can lock in about 30% share. The market is about $29M a year; at 25% share VoltRide earns $1.2M, so the $5M launch takes 4.2 years to pay back, beyond the 3-year limit. At 30% share, payback falls to 2.6 years, and longer-lasting scooters and a better app give VoltRide a case for taking share. The biggest risk is an incumbent price war. Next step: secure an anchor partnership, such as a university campus, before committing the $5M." },
  ], focus: ["payback", "share"] },

{ id: "3", title: "Ridgeline Capital & Bright Smile Dental", typeKey: "MNA", typeLabel: "Private equity",
  meta: { style: "Interviewer-led", industry: "Healthcare", diff: [3, 3, 2], mins: 35 },
  teaser: "A PE fund wants to buy a 40-clinic dental chain for $120M and grow it. Will it hit a 2.5× return?",
  behavioral: "Tell me about a time you persuaded a group to change its plan.",
  prompt: "Our client, Ridgeline Capital, is a private equity fund. It's considering buying Bright Smile Dental, a chain of 40 dental clinics in the Southeast, for $120M. Ridgeline's plan is to grow the chain by buying small independent practices, then sell the whole company in 5 years. Ridgeline only invests when it expects to at least 2.5× its money. Should it buy Bright Smile?",
  clarify: [
    ["What's the goal?", "Earn at least 2.5× the equity invested (MOIC) over 5 years."],
    ["How does Bright Smile make money?", "Each clinic earns about $2M a year from cleanings, fillings and cosmetic work, at a 15% EBITDA margin."],
    ["What's the industry like?", "Dental care grows slowly but steadily. Many independent dentists are near retirement and want to sell, so “buy-and-build” is common."],
    ["How would Ridgeline pay?", "With 50% debt and 50% equity."],
    ["How are dental chains valued?", "Similar chains sell for about 10× EBITDA."],
    ["Who else is buying?", "Several other PE-backed dental groups are buying practices in the region."],
  ],
  words: ["ridgeline", "bright smile", "dental", "clinic", "dentist"],
  kw: [["the market", ["market", "industry", "demand", "growth", "fragment"]], ["the target's quality", ["clinic", "ebitda", "margin", "revenue", "quality", "dentist", "patient"]], ["the value-creation plan", ["add-on", "acqui", "buy", "grow", "synerg", "improve", "plan"]], ["returns", ["moic", "return", "irr", "exit", "price", "debt", "multiple", "valuation", "2.5"]]],
  structure: tree([["Should Ridgeline buy Bright Smile?", 0, "b"], ["Market", 1, "g"], ["Demand growth, fragmentation, competition for deals", 2, "m"], ["Target", 1, "gr"], ["Clinic revenue and margins, dentist retention", 2, "m"], ["Value-creation plan", 1, "b"], ["Add-on clinics, margin gains, paying down debt", 2, "m"], ["Returns", 1, "v"], ["Entry price, financing, exit value → MOIC vs. 2.5×", 2, "m"]]),
  guide: "PE cases come down to entry price, growth in EBITDA, exit price and debt. If the candidate doesn't mention returns or MOIC, ask how Ridgeline will judge the deal.",
  steps: [
    { kind: "num", label: "The target today", q: "What is Bright Smile's EBITDA today? ($M)", ans: 12, tol: 0.1,
      traps: [[80, "That's revenue. Apply the 15% EBITDA margin."], [0.3, "That's one clinic. Multiply by 40."]],
      sol: "40 clinics × $2M = $80M revenue × 15% = <b>$12M EBITDA</b>. The $120M price is 10×, the same as similar chains." },
    { kind: "num", label: "Exhibit 1: The 5-year plan",
      exhibit: `<div class="g2">${fig("Clinics", vbars({ cats: ["Today", "Year 5"], series: [{ vals: [40, 60] }], h: 210 }))}${fig("EBITDA margin", vbars({ cats: ["Today", "Year 5"], series: [{ vals: [15, 18], color: "var(--c2)" }], suf: "%", h: 210 }))}</div>` + `<p class="small">Add 20 clinics by buying independent practices (each earns $2M at a 15% margin), paid for with equity at 5× each clinic's EBITDA. Shared billing and purchasing lift the margin to 18%.</p>`,
      q: "What is Bright Smile's EBITDA in year 5? ($M)", ans: 60 * 2 * 0.18, tol: 0.2,
      traps: [[18, "That's 60 clinics at today's 15% margin. Use 18%."], [14.4, "That's today's 40 clinics at 18%. Include the 20 new ones."]],
      sol: "60 clinics × $2M = $120M revenue × 18% = <b>$21.6M EBITDA</b>, up 80%." },
    { kind: "num", label: "Equity invested", q: "How much equity does Ridgeline put in, including the add-on clinics? ($M)", ans: 90, tol: 0.5,
      traps: [[60, "That's equity for the initial purchase only. Add the 20 add-on clinics."], [120, "That's the whole price; half is debt."], [150, "Half of the $120M price is debt, so only $60M of it is equity."]],
      sol: "Initial purchase: 50% of $120M = $60M. Add-ons: 20 × ($0.3M EBITDA × 5) = $30M. Total equity: <b>$90M</b>." },
    { kind: "num", label: "Exhibit 2: The exit",
      pre: "In year 5, Ridgeline sells at 10× EBITDA. By then it has paid the original $60M of debt down to $30M.",
      q: "What multiple of its money (MOIC) does Ridgeline earn?", ans: 186 / 90, tol: 0.04,
      traps: [[216 / 90, "You forgot to subtract the $30M of debt still owed at exit."], [186 / 60, "You left out the $30M of equity spent on add-ons."], [216 / 60, "Subtract the remaining debt, and count all $90M of equity."]],
      sol: "Exit value: $21.6M × 10 = $216M. Minus $30M debt = $186M to Ridgeline. MOIC = 186 ÷ 90 = <b>2.07×</b>, roughly a 16% annual return." + fig("Where the value comes from ($M)", waterfall({ items: [["Entry value", 120, "total"], ["EBITDA growth × 10", 96], ["Exit value", 216, "total"], ["Debt still owed", -30], ["Exit equity", 186, "total"]] })) },
    { kind: "mc", label: "Decision", q: "Does the deal meet Ridgeline's 2.5× target?", opts: ["Yes, comfortably", "Yes, just barely", "No, it falls short"], right: 2,
      sol: "2.07× is short of 2.5×. The plan works operationally, but the entry price is too high.",
      bonus: ["What's the most Ridgeline could pay and still hit 2.5×?", "If price is P: equity = P/2 + 30; exit equity = 216 − (P/2 − 30) = 246 − P/2. Set 246 − P/2 = 2.5 × (P/2 + 30) → P ≈ $98M, about 8× EBITDA."] },
    { kind: "brain", label: "Brainstorm", q: "What could Ridgeline do to improve returns, and what could make them worse?",
      ideas: ["<b>Improve:</b> negotiate the price toward ~$98M; buy add-ons faster or below 5×; raise margins (purchasing, scheduling); add higher-value services like orthodontics", "<b>Worsen:</b> dentists leave after the sale; rival buyers push add-on prices above 5×; exit multiples fall; integration takes longer", "<b>Start with:</b> price, since it's the one lever Ridgeline controls before signing"] },
    { kind: "rec", label: "Recommendation", q: "Give the investment committee your recommendation.",
      model: "Ridgeline should not buy Bright Smile at $120M, but should bid around $95–98M. The plan grows EBITDA from $12M to $21.6M, but at $120M, Ridgeline's $90M of equity becomes $186M, about 2.1×, short of the 2.5× target. At roughly $98M, the same plan reaches 2.5×. The biggest risk is losing dentists after the sale, so the offer should include retention packages. Next step: diligence on the add-on pipeline and dentist retention before submitting the bid." },
  ], focus: ["2.1", "2.07", "moic", "98", "price"] },

{ id: "4", title: "RouteWise school-bus software", typeKey: "PRC", typeLabel: "Pricing",
  meta: { style: "Candidate-led", industry: "Software · Education", diff: [2, 2, 2], mins: 25 },
  teaser: "A startup's routing software saves school districts money. What annual price should it charge?",
  behavioral: "Tell me about a time you negotiated something.",
  prompt: "Our client, RouteWise, has built software that plans school-bus routes. It cuts the miles buses drive and can reduce how many buses a district needs. RouteWise is about to launch with school districts across Georgia and wants to know what annual price to charge a typical district.",
  clarify: [
    ["What's the goal?", "Win districts quickly while earning a healthy margin, with one annual price for a typical district."],
    ["What's a typical district?", "About 100 buses, each driving 15,000 miles a year. A bus costs about $3 per mile in fuel and maintenance."],
    ["Who are the competitors?", "One competitor, BasicRoute, sells routing software for $150K a year."],
    ["What does it cost RouteWise to serve a district?", "About $50K a year for setup, support and hosting."],
    ["How do districts buy?", "The transportation director proposes it; purchases over $250K need a school board vote."],
  ],
  words: ["routewise", "district", "bus", "school", "basicroute"],
  kw: [["the cost floor", ["cost", "margin", "serve", "floor"]], ["the competitor's price", ["compet", "basicroute", "alternative", "substitut"]], ["value to the district", ["value", "saving", "save", "willing", "benefit", "roi"]], ["how districts buy", ["board", "budget", "approv", "adopt", "district", "tier", "pilot"]]],
  structure: tree([["What price per district?", 0, "b"], ["Cost floor", 1, "r"], ["$50K a year to serve", 2, "m"], ["Competitor reference", 1, "g"], ["BasicRoute: $150K, and what it saves", 2, "m"], ["Value to the district", 1, "gr"], ["Miles saved, buses no longer needed", 2, "m"], ["Buying process", 1, "v"], ["Board vote above $250K, budget cycles", 2, "m"]]),
  guide: "Look for a cost floor, a competitor reference and a value ceiling. The insight is that value is far above both cost and the competitor's price.",
  steps: [
    { kind: "num", label: "Exhibit 1: Pilot results",
      exhibit: `<div class="g2">${fig("Route miles saved", vbars({ cats: ["RouteWise", "BasicRoute"], series: [{ vals: [15, 8] }], suf: "%", h: 200 }))}${fig("Buses no longer needed", vbars({ cats: ["RouteWise", "BasicRoute"], series: [{ vals: [5, 0], color: "var(--c2)" }], h: 200 }))}</div><p class="small">Pilot results in a typical district. Each bus no longer needed saves $60K a year in driver pay and upkeep.</p>`,
      q: "How much does RouteWise save a typical district per year? ($K)", ans: 975, tol: 5,
      traps: [[675, "That's only the mileage savings. Add 5 buses × $60K."], [300, "That's only the bus savings. Add the mileage savings."]],
      sol: "Miles: 100 buses × 15,000 × 15% × $3 = $675K. Buses: 5 × $60K = $300K. Total: <b>$975K a year</b>." },
    { kind: "num", label: "The competitor", q: "How much does BasicRoute save the same district per year? ($K)", ans: 360, tol: 3,
      traps: [[675, "That's RouteWise's mileage savings. BasicRoute saves 8%, not 15%."]],
      sol: "100 × 15,000 × 8% × $3 = <b>$360K</b>, with no buses saved." },
    { kind: "num", label: "Value-based price", q: "Economic value to the customer (EVC) = competitor's price + the extra value we deliver. What is RouteWise's EVC? ($K)", ans: 765, tol: 3,
      traps: [[975, "That's total savings. EVC starts from BasicRoute's price and adds only the extra value over BasicRoute."], [615, "That's the extra value. Add BasicRoute's $150K price."]],
      sol: "Extra value: $975K − $360K = $615K. EVC = $150K + $615K = <b>$765K</b>, the most a rational district would pay." + fig("Where RouteWise's price can sit ($K per year)", hbars({ rows: [["Cost to serve (floor)", 50], ["BasicRoute's price", 150], ["RouteWise EVC (ceiling)", 765], ["RouteWise total savings", 975]], hl: 2 })) },
    { kind: "mc", label: "Choose a price", q: "Which annual price should RouteWise launch with?",
      opts: ["$150K: match BasicRoute to win share fast", "$240K: above the competitor, under the $250K board-vote line", "$500K: capture most of the extra value", "$765K: charge the full EVC"], right: 1,
      sol: "At $240K a district nets $735K a year ($975K − $240K) versus $210K with BasicRoute ($360K − $150K), an obvious win. RouteWise keeps $190K margin per district, and staying under $250K avoids a board vote, which speeds up sales. Higher prices slow adoption; matching $150K gives away value." },
    { kind: "brain", label: "Brainstorm", q: "How else could RouteWise structure pricing to win districts?",
      ideas: ["<b>Price structure:</b> per-bus pricing so small districts pay less; tiers by features", "<b>Lower risk for buyers:</b> free pilot, savings guarantee, gain-sharing (a % of savings)", "<b>Commitment:</b> multi-year discounts, statewide purchasing contracts", "<b>Bundles:</b> GPS tracking, parent notification app", "<b>Start with:</b> a first-year savings guarantee, since districts are cautious buyers"] },
    { kind: "rec", label: "Recommendation", q: "Recommend a price to RouteWise's founders.",
      model: "RouteWise should launch at about $240K per district per year. A typical district saves $975K with RouteWise versus $360K with BasicRoute, so even at $240K it comes out $525K a year ahead of buying the competitor. The price keeps a $190K margin per district and stays under the $250K board-vote threshold, which shortens sales cycles. The main risk is that savings vary by district, so I'd offer a first-year savings guarantee. Next step: pilot in five districts of different sizes to test per-bus pricing." },
  ], focus: ["240"] },

{ id: "5", title: "Sunbelt Medical Center ER", typeKey: "OPS", typeLabel: "Operations",
  meta: { style: "Interviewer-led", industry: "Healthcare", diff: [2, 2, 2], mins: 30 },
  teaser: "8% of ER patients leave before seeing a doctor. Find the bottleneck and spend $1M wisely.",
  behavioral: "Tell me about a time you improved a process.",
  prompt: "Sunbelt Medical Center, a hospital in suburban Atlanta, has a problem in its emergency room. Waits are so long that about 8% of patients leave before seeing a doctor. The COO has $1M a year to fix it and wants to know where to spend it.",
  clarify: [
    ["What's the goal?", "Cut the share of patients who leave without being seen from 8% to 2% or less."],
    ["How many patients come in?", "About 120 a day, spread fairly evenly across the day for this case."],
    ["How big is the ER?", "22 treatment beds."],
    ["Why does leaving matter?", "Each patient who leaves is about $500 of lost revenue, and a risk to their health."],
    ["Is the ER understaffed?", "Doctor and nurse staffing meets national guidelines."],
  ],
  words: ["sunbelt", "er", "emergency", "patient", "bed", "hospital", "lab"],
  kw: [["demand (patient arrivals)", ["arriv", "demand", "volume", "patients per"]], ["capacity (beds and staff)", ["bed", "staff", "capacity", "doctor", "nurse"]], ["the patient's steps through the ER", ["process", "step", "wait", "bottleneck", "lab", "test", "triage", "flow", "discharge"]], ["costs and options", ["cost", "budget", "option", "revenue", "invest"]]],
  structure: tree([["Why do patients leave?", 0, "r"], ["Demand", 1, "g"], ["Arrivals by hour, how sick patients are", 2, "m"], ["Capacity", 1, "b"], ["Beds, doctors, nurses", 2, "m"], ["Process: time at each step", 1, "gr"], ["Triage → wait → exam → tests → discharge", 2, "m"], ["Find the bottleneck", 2, "m"], ["Options", 1, "v"], ["Cost vs. revenue recovered and patient safety", 2, "m"]]),
  guide: "The key tool is Little's law: patients in the ER = arrivals per hour × hours each stays. Introduce it if the candidate doesn't.",
  steps: [
    { kind: "num", label: "Exhibit 1: A patient's visit",
      exhibit: fig("Average minutes per step", hbars({ rows: [["Triage", 15], ["Wait for a doctor", 60], ["Doctor exam", 30], ["Waiting on lab results", 150], ["Discharge paperwork", 45]], hl: 3, suf: " min" }), { note: "Total: 300 minutes, or 5 hours." }),
      q: "Little's law: patients in the ER at once = arrivals per hour × hours each patient stays. On average, how many patients are in the ER at once?", ans: 25, tol: 0.3,
      traps: [[600, "You used arrivals per day. Convert to per hour first: 120 ÷ 24 = 5."], [1500, "Convert the stay to hours: 300 minutes = 5 hours."]],
      sol: "5 patients per hour × 5 hours = <b>25 patients</b>, but there are only 22 beds. The extra 3 wait in the lobby, and some give up." },
    { kind: "mc", label: "The bottleneck", q: "Which step should the hospital attack first?", opts: ["Triage", "Waiting for a doctor", "Waiting on lab results", "Discharge paperwork"], right: 2,
      sol: "Lab results take 150 of 300 minutes, half of every stay. That's the bottleneck." },
    { kind: "insight", label: "Exhibit 2: Lab waits by time of day",
      pre: "The lab has two technicians on day shift (7am–3pm) and one in the evening and overnight.",
      exhibit: fig("Average wait for lab results (minutes)", lineChart({ x: ["6am", "9am", "12pm", "3pm", "6pm", "9pm", "12am", "3am"], series: [{ vals: [90, 110, 140, 170, 190, 200, 150, 110], color: "var(--c2)" }] })),
      q: "What does this exhibit tell you, and what would you do about it?",
      keys: [["when waits peak (evening)", ["evening", "night", "pm", "afternoon", "later in the day"]], ["the size of the swing", ["200", "90", "double", "twice"]], ["the link to lab staffing", ["tech", "staff", "shift", "one person", "one tech"]]],
      model: "Lab waits climb all afternoon and peak around 9pm at about 200 minutes, more than double the 90 minutes at 6am. That lines up with the lab dropping from two technicians to one after 3pm. So the bottleneck is evening lab staffing, which points to adding an evening technician rather than more beds." },
    { kind: "num", label: "Exhibit 3: Options",
      exhibit: kt([["Option", "Cost per year", "Effect"], ["A: second evening lab tech + faster test machine", "$400K", "Lab wait 150 → 90 min"], ["B: add 4 beds in a converted hallway", "$900K", "Beds 22 → 26; times unchanged"]], [1]),
      q: "With option A, how many patients would be in the ER at once?", ans: 20, tol: 0.3,
      traps: [[25, "That's today. Option A cuts the stay by 60 minutes."], [5 * 4.5, "The stay drops by 60 minutes, from 300 to 240 (4 hours)."]],
      sol: "Stay: 300 − 60 = 240 minutes = 4 hours. 5 × 4 = <b>20 patients</b>, under 22 beds, so the lobby queue should largely disappear. Option B gives 26 beds for 25 patients, a thin cushion at more than twice the cost." },
    { kind: "num", label: "The payoff", q: "If option A cuts walk-outs from 8% to 2%, how much annual revenue does the hospital recover? ($M)", ans: 0.06 * 120 * 365 * 500 / 1e6, tol: 0.03,
      traps: [[0.08 * 120 * 365 * 500 / 1e6, "That's the revenue lost at 8%. The fix recovers 6 points, from 8% to 2%."], [0.06 * 120 * 500 / 1e6, "That's per day. Multiply by 365."]],
      sol: "6% × 120 = 7.2 patients a day × 365 × $500 = <b>$1.31M a year</b>, more than 3× option A's $400K cost." },
    { kind: "brain", label: "Brainstorm", q: "Besides the lab, how else could the ER cut waits?",
      ideas: ["<b>Front end:</b> a doctor at triage, a fast-track lane for minor cases, online check-in", "<b>Lab:</b> bedside tests for common results, a runner or tube system, priority rules", "<b>Back end:</b> a discharge lounge, faster transfer to inpatient beds, a discharge nurse", "<b>Demand:</b> partner urgent-care clinics, telehealth for minor issues", "<b>Start with:</b> fast-track, since minor cases are often a large share of visits"] },
    { kind: "rec", label: "Recommendation", q: "Give the COO your recommendation.",
      model: "Sunbelt should spend $400K a year on option A: a second evening lab technician and a faster test machine. Lab results take half of every patient's 5-hour stay and get worst in the evening, when only one technician works. Cutting lab time to 90 minutes shortens stays to 4 hours, so about 20 patients are in the ER at once against 22 beds. Reducing walk-outs from 8% to 2% recovers about $1.3M a year, more than three times the cost, and makes patients safer. The risk is that demand grows and the queue returns, so we'd track walk-outs monthly. Next step: a 90-day pilot, plus a fast-track lane with the remaining budget." },
  ], focus: ["lab"] },

{ id: "6", title: "Peach Pit Snacks: the road to $300M", typeKey: "GRW", typeLabel: "Growth strategy",
  meta: { style: "Candidate-led", industry: "Consumer goods", diff: [3, 2, 3], mins: 35 },
  teaser: "A Georgia snack maker promised $300M in 5 years. Size the gap and pick the right bets within budget.",
  behavioral: "Tell me about a time you had to prioritize between competing goals.",
  prompt: "Peach Pit Snacks, a Georgia maker of kettle chips and pretzels, has $200M in annual revenue, sold mostly in Southeast grocery stores. The new CEO has promised the board $300M in revenue within 5 years. Her team has four growth ideas and $150M to invest. Which should they pursue?",
  clarify: [
    ["What's the goal?", "$300M revenue in year 5, without lowering profit margins."],
    ["How fast is the core growing?", "About 3% a year if nothing changes."],
    ["Where does it sell?", "About 80% through grocery stores, the rest through convenience stores."],
    ["Any budget limits?", "Up to $150M of investment over 5 years."],

function md(src) {
  const lines = String(src).split("\n"); let out = "", i = 0;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^[\s|:-]+$/.test(r));
      const [h, ...rest] = body;
      out += `<div class="tbl-w"><table class="tbl"><thead><tr>${cells(h).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); i++; }
      out += `<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue;
    }
    if (/^#{1,4}\s/.test(l)) { out += `<p><b>${inline(l.replace(/^#+\s/, ""))}</b></p>`; i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^\s*(\||[-*]\s|\d+\.\s|#)/.test(lines[i])) { para.push(lines[i]); i++; }
    out += `<p>${para.map(inline).join("<br>")}</p>`;
  }
  return out;
}

async function aiAsk() {
  const node = aiBubble("assistant", `<p class="faint">Thinking…</p>`);
  const bt = $(".bt", node);
  AI.ctl = new AbortController(); aiBusy(true); $("#ai-err").innerHTML = "";
  try {

    AI.turns.push({ role: "assistant", content: text });
  } catch (e) {

    if (e && e.code !== "cancelled") $("#ai-err").innerHTML = `<div class="fb no">${AI_ERR[e.code] || "Something went wrong reaching Claude. Send your message again."}</div>`;
  } finally { aiBusy(false); }
